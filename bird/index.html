<title>人生不止两点一线</title>
<style>
:root{color-scheme:dark;--surface:#08090d;--shade:#14161e;--paper:#eeeff3;--muted:#aaaeba}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--paper);font:14px/1.45 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
main{min-height:100svh;display:grid;justify-items:center;align-content:center;padding:12px 10px max(11px,env(safe-area-inset-bottom))}
.player{width:min(100%,calc((100svh - 90px)*.75),960px);min-width:0}
.screen{display:block;position:relative;width:100%;aspect-ratio:3/4;background:#000;color:inherit}
canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.status{margin:7px 8px 0;color:#c7d1f2;font-size:12px;text-align:right}
button[data-audio-blocked]{background:#282f46;border-color:#95a7df;color:#f0f3ff}
[hidden]{display:none!important}
.controls{margin-top:7px;display:flex;gap:8px;align-items:center}
button{font:inherit;color:inherit;background:var(--shade);border:1px solid #2a2d38;padding:7px 10px;cursor:pointer;white-space:nowrap;border-radius:3px;min-height:40px}
button:hover{background:#232634}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #bbcbff;outline-offset:2px}
input{accent-color:#bac7ff;min-width:24px;margin:0;flex:1;height:34px;cursor:pointer}
time{flex:none;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
footer{padding-top:5px;color:#a4a8b7;font-size:11px;text-align:right}
.screen:fullscreen{width:100%;height:100%;display:grid;place-items:center}
.screen:fullscreen canvas{width:min(100vw,75vh);height:min(133.333vw,100vh)}
@media(max-width:540px){main{padding-inline:0}.player{width:min(100%,calc((100svh - 76px)*.75))}.controls,footer{margin-inline:8px}.controls{gap:5px}button{padding:6px 7px}}
</style>

  ctx.save();
  try {if(when<SWITCH) window.drawIntro(ctx,when,W,H);else window.drawFlight(ctx,when,W,H);} finally {ctx.restore();}
}
function draw(){
  const at=current(),quantized=Math.min(DURATION-.0001,Math.floor(at*60)/60);
  if(last!==quantized){paint(quantized);last=quantized;}
  const step=Math.round(at*10);
  if(step!==shownTime){if(!scrubbing)seek.value=at;time.textContent=`${(step/10).toFixed(1)} / 15.7`;shownTime=step;}
}
function tick(){frame=0;draw();if(playing&&current()>=DURATION-.012){stop(DURATION);setControls();}else if(playing)frame=requestAnimationFrame(tick);}
function setControls(){
  const label=playing?'暂停':position>=DURATION-.012?'重播':'播放';
  toggle.textContent=label;toggle.setAttribute('aria-label',label);
  sound.textContent=soundOn?'关闭原声':'开启原声';sound.setAttribute('aria-pressed',String(soundOn));
}
function clearSoundStatus(){
  status.hidden=true;
  sound.removeAttribute('data-audio-blocked');
  sound.removeAttribute('aria-describedby');
}
function syncAudio(t){
  if(!soundOn||!playing)return;
  const id=++attempt;
  position=t;pending=true;
  clearSoundStatus();
  audio.currentTime=Math.min(DURATION-.015,t);
  audio.play().then(()=>{
    if(id!==attempt)return;
    pending=false;audible=true;
  }).catch(error=>{
    if(id!==attempt)return;
    pending=false;audible=false;soundOn=false;anchor=performance.now();
    setControls();
    sound.setAttribute('data-audio-blocked','');
    sound.setAttribute('aria-describedby','status');
    status.textContent=error?.name==='NotAllowedError'?'浏览器拦截了自动播放声音，点「开启原声」即可':'原声暂未播放，可点「开启原声」重试';
    status.hidden=false;
  });
}
function start(){
  if(playing)return;if(position>=DURATION-.012) position=0;
  playing=true;anchor=performance.now();syncAudio(position);setControls();if(!frame) frame=requestAnimationFrame(tick);
}
function stop(at=current()){
  playing=false;position=at;audible=false;pending=false;attempt++;audio.pause();cancelAnimationFrame(frame);frame=0;draw();setControls();
}
function changeSound(){
  if(soundOn){const at=current();soundOn=false;pending=false;attempt++;audio.pause();audible=false;position=at;anchor=performance.now();clearSoundStatus();setControls();return;}
  const at=current();soundOn=true;position=at;anchor=performance.now();
  if(!playing)start();else syncAudio(at);setControls();
}
function playPause(){if(playing)stop();else start();}
toggle.addEventListener('click',playPause);canvas.addEventListener('click',playPause);
canvas.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();playPause();}});
sound.addEventListener('click',changeSound);
function endScrub(){if(!scrubbing)return;scrubbing=false;if(restore&&position<DURATION-.03)start();}
seek.addEventListener('pointerdown',()=>{restore=playing;scrubbing=true;if(playing)stop();});
seek.addEventListener('input',()=>{const at=Number(seek.value);if(playing){position=at;anchor=performance.now();if(soundOn){audio.currentTime=at;}}else position=at;last=-1;draw();setControls();});
seek.addEventListener('change',endScrub);seek.addEventListener('pointerup',endScrub);seek.addEventListener('pointercancel',endScrub);
full.addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen?.();}else screen.requestFullscreen?.()?.catch(()=>{});});
if(!screen.requestFullscreen)full.hidden=true;
document.addEventListener('fullscreenchange',size);
new ResizeObserver(size).observe(canvas);
size();setControls();
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)start();
})();
</script>
</body>
</html>
