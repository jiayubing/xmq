<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0615" />
  <title>今夜，局部紫色流星雨</title>
  <link rel="icon" href="data:," />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0A0615;
      color: #F3E8FF;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: pointer;
    }

    /* 顶部极简控制角标 */
    #top-controls {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 600ms ease;
    }

    #top-controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-pill {
      appearance: none;
      border: 1px solid rgba(196, 181, 253, 0.22);
      background: rgba(18, 10, 38, 0.54);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(233, 213, 255, 0.84);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, opacity 200ms ease;
    }

    .icon-pill:hover {
      background: rgba(91, 33, 182, 0.45);
      border-color: rgba(216, 180, 254, 0.45);
      color: #FAF5FF;
    }

    .icon-pill.muted {
      color: rgba(216, 180, 254, 0.48);
    }

    /* 底部自由交互胶囊（仅在开场动画落定后淡入） */
    #dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 750ms ease, transform 750ms ease;
    }

    #dock.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .dock-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border-radius: 999px;
      background: rgba(18, 10, 38, 0.66);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(196, 181, 253, 0.26);
      box-shadow: 0 10px 30px rgba(6, 2, 16, 0.42);
    }

    .dock-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(233, 213, 255, 0.88);
      font-size: 12.5px;
      letter-spacing: 0.05em;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, transform 150ms ease;
    }

    .dock-btn:hover {
      background: rgba(139, 92, 246, 0.26);
      color: #FAF5FF;
    }

    .dock-btn:active {
      transform: scale(0.96);
    }

    .dock-btn.primary {
      background: rgba(124, 58, 237, 0.72);
      color: #FAF5FF;
      font-weight: 500;
    }

    .dock-btn.primary:hover {
      background: rgba(139, 92, 246, 0.85);
    }

    .dock-btn.gold {
      color: #FDE68A;
    }

    .dock-hint {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(216, 180, 254, 0.56);
      text-align: center;
      pointer-events: none;
    }

    /* 开场进度极细发丝线 */
    #intro-progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      z-index: 25;
      background: rgba(255, 255, 255, 0.05);
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease;
    }

    #intro-progress.visible {
      opacity: 1;
    }

    #intro-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7C3AED, #C4B5FD, #FDE68A);
    }

    /* 纯净壁纸模式（隐藏按钮，仅留右上角一个半透明恢复按钮） */
    body.zen-mode #dock,
    body.zen-mode #btn-sound,
    body.zen-mode #btn-bgm {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    body.zen-mode #btn-zen {
      opacity: 0.35;
    }
    body.zen-mode #btn-zen:hover {
      opacity: 0.9;
    }

    .xmq-home {
      position: fixed;
      z-index: 40;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 10px;
      gap: 5px;
      border: 1px solid #e9dcfa66;
      border-radius: 999px;
      background: #231537bc;
      color: #f8efff;
      font: 12px/1 system-ui, sans-serif;
      text-decoration: none;
    }

    .xmq-home:hover { background: #231537; }
    .xmq-home:focus-visible, button:focus-visible {
      outline: 2px solid #f8efff;
      outline-offset: 2px;
    }
    body.zen-mode .xmq-home { display: none; }

    @media (max-width: 420px) {
      .xmq-home { top: max(10px, env(safe-area-inset-top)); }
      #top-controls {
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        gap: 4px;
      }
      .icon-pill { padding: 7px 7px; font-size: 11px; }
      .dock-bar { gap: 3px; padding: 5px; }
      .dock-btn { padding: 8px 9px; font-size: 12px; }
    }

    @media (max-height: 475px) {
      #dock { bottom: max(8px, env(safe-area-inset-bottom)); }
      .dock-hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      #top-controls, #dock, #intro-progress { transition: none; }
    }
  </style>
</head>
<body>
  <a class="xmq-home" href="../index.html" aria-label="返回作品首页"><span aria-hidden="true">‹</span> 作品</a>
  <canvas id="stage" role="img" aria-label="紫夜中一把落下星星的伞。点击开合，左右拖动转伞，可用下方按钮许愿。"></canvas>

  <!-- 顶部极简声音与纯净模式按钮 -->
  <div id="top-controls" inert>
    <button id="btn-sound" class="icon-pill muted" aria-pressed="false" title="开启声音">🔇 静音</button>
    <button id="btn-bgm" class="icon-pill">钢琴夜曲：开</button>
    <button id="btn-zen" class="icon-pill" title="隐藏界面按钮，纯净欣赏">纯净</button>
  </div>

  <!-- 底部自由交互胶囊（开场动画结束后自动淡入） -->
  <div id="dock" inert>
    <div class="dock-bar">
      <button id="dock-toggle" class="dock-btn primary">撑伞落星</button>
      <button id="dock-spin" class="dock-btn">转伞</button>
      <button id="dock-wish" class="dock-btn gold">许愿星</button>
      <button id="dock-replay" class="dock-btn">重播</button>
    </div>
    <div class="dock-hint">点击开合伞 · 左右滑动拨转 · 轻点水洼落许愿星</div>
  </div>

  <!-- 开场进度发丝线 -->
  <div id="intro-progress">
    <div id="intro-progress-fill"></div>
  </div>

  <script src="./violetAudio.js"></script>
  <script>
    const CONFIG = {
      poemLines: [
        'Keep a quiet wish tonight,',
        'let the little stars fall slow —',
        'everything you have been hoping for',
        'is already on its way.'
      ],
      wishEasterEggCount: 3,
      wishEasterEggLines: [
        '心里一直惦记着的那些愿望，',
        '今夜就悄悄替你接住吧。',
        '愿你天天开心，事事顺心，',
        '所有想要的，都会慢慢如愿。'
      ]
    };

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new VioletAudioEngine();
    const topControls = document.getElementById('top-controls');
    const btnSound = document.getElementById('btn-sound');
    const btnBgm = document.getElementById('btn-bgm');
    const btnZen = document.getElementById('btn-zen');
    const dock = document.getElementById('dock');
    const dockToggle = document.getElementById('dock-toggle');
    const introProgress = document.getElementById('intro-progress');
    const introProgressFill = document.getElementById('intro-progress-fill');
    const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');

    const TAU = Math.PI * 2;
    const NUM_RIBS = 12;
    const RIB_STEP = TAU / NUM_RIBS;
    const OPEN_PITCH = -0.15;
    const FOLDED_ROTATION = Math.PI - 0.12;
    const ENAMEL = '#7A56C4';
    const HARDWARE_GLINT = 'rgba(191,166,246,.38)';
    const STAR_COLORS = ['#FDE68A', '#F6CB61', '#F5F3FF', '#DDD6FE'];
    const WISH_COLOR = '#FFE39A';
    const OPEN_WATER_RY = 23.1;
    const RAIN_DUST = { size: [0.55, 1.0], duration: [1.77, 2.12], tail: [7, 12], brightness: 0.56 };
    const RAIN_STAR = { size: [1.5, 2.7], duration: [1.60, 1.96], tail: [13, 22], brightness: 0.82 };
    const RAIN_SPARK = { size: [3.2, 4.9], duration: [1.45, 1.80], tail: [22, 32], brightness: 1 };
    const INTRO = {
      openStart: 0.6, spinStart: 1.4, peakStart: 2.7, coastStart: 3.5,
      rainTaperStart: 4.5, rainEnd: 5.55, lastLanding: 6.94, closeStart: 7, end: 7.9, peakSpeed: 5.9
    };
    const THREADS = [
      [11.5, 0.042, 0.68, 0, '#E6D4FF'], [15, -0.035, 2.05, 4, '#FFF0BA'],
      [19, -0.043, 2.55, 8, '#E6D4FF'], [8, 0.026, 1.38, 4, '#E6D4FF'],
      [13, 0.037, 1.75, 4, '#FDE68A'], [21, -0.028, 2.65, 8, '#FFF0BA'],
      [16, 0.040, 2.10, 4, '#E6D4FF'], [10.5, -0.047, 0.70, 0, '#E6D4FF'],
      [18, 0.025, 2.25, 4, '#FDE68A'], [12, -0.035, 1.68, 4, '#E6D4FF'],
      [14.5, 0.032, 2.15, 8, '#E6D4FF'], [9, -0.040, 0.66, 0, '#FFF0BA']
    ].map(([length, slant, size, kind, color], i) => ({
      length, slant, size, kind, color,
      frequency: 9.6 * Math.sqrt(14 / length),
      windPhase: i * 2.39996, windStrength: 0.13 + (i * 7 % 12) * 0.012,
      flare: 0, flareVel: 0, lag: 0, lagVel: 0
    }));
    const background = document.createElement('canvas');
    const inkGrain = document.createElement('canvas');

    let W = 0, H = 0, dpr = 0, dockCeiling = 0;
    let active = false, frameRequest = 0, last = 0, time = 0;
    let appState, introClock = 0;
    let targetOpen = 0, openVal = 0, openVel = 0, waterOpen = 0;
    let rot = FOLDED_ROTATION, omega = 0, previousOmega = 0, angularAccel = 0;
    let pitchExtra = 0, rollExtra = 0;
    let pointer = null;

    let userMuted = false, soundRequested = false, soundUnlocked = false;
    let soundSuspension = null, pendingCanopySound = null;

    let starSpawnAcc = 0, wishCount = 0, poemBlend = 0;
    let introRainSeeded = false, introRandom;
    const stars = [];
    const impacts = [];

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function phase(lo, hi, v) { return clamp((v - lo) / (hi - lo), 0, 1); }
    function smoothstep(lo, hi, v) {
      const t = phase(lo, hi, v);
      return t * t * (3 - 2 * t);
    }
    function wrapAngle(angle) { return ((angle % TAU) + TAU) % TAU; }

    function seededRandom(seed) {
      return () => {
        seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
        return seed / 4294967296;
      };
    }

    function soundIsPlaying() {
      return audio.enabled && audio.ctx?.state === 'running';
    }

    function syncAudioUI() {
      const playing = soundIsPlaying();
      btnSound.textContent = playing ? '🔊 声音' : '🔇 静音';
      btnSound.classList.toggle('muted', !playing);
      btnSound.setAttribute('aria-pressed', String(playing));
      btnSound.title = playing ? '静音' : '开启声音';
      btnBgm.textContent = audio.musicEnabled ? '钢琴夜曲：开' : '钢琴夜曲：关';
      btnBgm.classList.toggle('muted', !audio.musicEnabled);
    }

    function onAudioStateChange() {
      if (audio.enabled && !soundIsPlaying()) audio.disable();
      syncAudioUI();
    }

    function pauseSound() {
      audio.disable();
      const context = audio.ctx;
      if (context && context.state !== 'closed') {
        const gain = audio.masterGain.gain;
        gain.cancelScheduledValues(0);
        gain.value = 0;
        gain.setValueAtTime(0, context.currentTime);
        if (!soundSuspension) {
          soundSuspension = context.suspend().catch(() => {}).finally(() => { soundSuspension = null; });
        }
      }
      syncAudioUI();
    }

    function canPlaySound() {
      return active && !document.hidden && !userMuted && soundRequested;
    }

    async function enableSound() {
      if (!active || document.hidden || userMuted) return;
      soundRequested = true;
      try {
        const context = audio.ctx;
        if (context && (soundSuspension || context.state === 'interrupted')) {
          await context.resume();
          if (!canPlaySound()) return;
        }
        const enabling = audio.enable();
        if (!context && audio.ctx) audio.ctx.addEventListener('statechange', onAudioStateChange);
        await enabling;
      } catch {
        // 下一次有效手势仍可尝试解锁。
      } finally {
        if (!canPlaySound()) {
          pauseSound();
        } else if (soundIsPlaying()) {
          soundUnlocked = true;
          if (pendingCanopySound && performance.now() <= pendingCanopySound.until) {
            playCanopySound(pendingCanopySound.open);
          }
          pendingCanopySound = null;
        } else if (audio.enabled) {
          audio.disable();
        }
        syncAudioUI();
      }
    }

    function isActivatingGesture(event) {
      return event.isTrusted && navigator.userActivation?.isActive !== false;
    }

    function unlockSoundOnGesture(event) {
      if (!active || userMuted || soundIsPlaying() || !isActivatingGesture(event)) return;
      const keyboard = event.type === 'keydown';
      if (keyboard) {
        if (event.key === 'Escape' || event.repeat || event.isComposing
          || event.altKey || event.ctrlKey || event.metaKey
          || ['Alt', 'AltGraph', 'Control', 'Meta', 'Shift'].includes(event.key)) return;
      } else if (event.button !== 0 || (event.type === 'pointerdown' && event.pointerType !== 'mouse')
        || (event.type === 'pointerup' && event.pointerType === 'mouse')) {
        return;
      }
      if ((!keyboard || event.key === 'Enter' || event.key === ' ') && event.target.closest?.('#btn-sound')) return;
      void enableSound();
    }

    document.addEventListener('pointerdown', unlockSoundOnGesture, true);
    document.addEventListener('pointerup', unlockSoundOnGesture, true);
    document.addEventListener('click', unlockSoundOnGesture, true);
    document.addEventListener('keydown', unlockSoundOnGesture, true);
    btnSound.addEventListener('click', event => {
      if (!isActivatingGesture(event)) return;
      userMuted = soundIsPlaying();
      if (userMuted) {
        soundRequested = false;
        pendingCanopySound = null;
        pauseSound();
      } else {
        void enableSound();
      }
    });

    btnBgm.addEventListener('click', () => {
      audio.setMusicEnabled(!audio.musicEnabled);
      syncAudioUI();
    });

    btnZen.addEventListener('click', () => {
      const zen = document.body.classList.toggle('zen-mode');
      btnZen.textContent = zen ? '显示按钮' : '纯净';
    });

    function playCanopySound(open) {
      if (open) audio.playOpen();
      else audio.playClose();
    }

    function setTargetOpen(next, withSound = true) {
      if (next === targetOpen) return;
      targetOpen = next;
      dockToggle.textContent = next ? '合伞收池' : '撑伞落星';
      if (!withSound) return;
      if (soundIsPlaying()) {
        playCanopySound(next);
      } else if (!userMuted) {
        // 触屏开伞在点击解锁前发生，保留这一小段音效。
        pendingCanopySound = { open: next, until: performance.now() + 350 };
      }
    }

    function startIntro() {
      const reduced = motionPreference.matches;
      appState = 'intro';
      introClock = time = 0;
      setTargetOpen(reduced ? 1 : 0, false);
      waterOpen = openVal = targetOpen;
      openVel = pitchExtra = rollExtra = starSpawnAcc = 0;
      rot = reduced ? 0 : FOLDED_ROTATION;
      omega = previousOmega = angularAccel = 0;
      resetThreads();
      stars.length = impacts.length = 0;
      introRainSeeded = false;
      introRandom = seededRandom(4179);
      audio.resetPhrase();

      topControls.inert = false;
      topControls.classList.add('visible');
      if (reduced) {
        const P = getParams();
        seedRain(getCanopy(P), P);
        enterInteractive();
        return;
      }
      addImpact({ x: -3.5, v: -0.08, wish: false }, 0.07, 0.29);
      dock.inert = true;
      dock.classList.remove('visible');
      introProgress.classList.add('visible');
      introProgressFill.style.width = '0%';
    }

    function enterInteractive() {
      appState = 'interactive';
      dock.inert = false;
      dock.classList.add('visible');
      introProgress.classList.remove('visible');
    }

    function toggleUmbrella() {
      setTargetOpen(1 - targetOpen);
      if (targetOpen && !motionPreference.matches) omega = 0.45;
    }

    dockToggle.addEventListener('click', toggleUmbrella);
    document.getElementById('dock-spin').addEventListener('click', () => {
      setTargetOpen(1);
      omega = clamp(omega + 3.5, -7.8, 7.8);
    });
    document.getElementById('dock-wish').addEventListener('click', () => {
      setTargetOpen(1);
      spawnWishStar();
    });
    document.getElementById('dock-replay').addEventListener('click', startIntro);

    canvas.addEventListener('pointerdown', event => {
      if (!active || pointer || !event.isPrimary || event.button !== 0) return;
      const tookOver = appState === 'intro';
      if (tookOver) {
        enterInteractive();
        setTargetOpen(1);
      }
      pointer = { id: event.pointerId, x: event.clientX, y: event.clientY,
        lastX: event.clientX, spinAt: performance.now(), moved: false, tookOver };
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener('pointermove', event => {
      if (event.pointerId !== pointer?.id) return;
      if (!pointer.moved && Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y) <= 7) return;
      const dx = event.clientX - pointer.lastX;
      pointer.lastX = event.clientX;
      pointer.moved = true;
      setTargetOpen(1);
      if (dx !== 0) {
        const now = performance.now();
        const delta = dx * 0.011;
        rot = wrapAngle(rot + delta);
        omega = clamp(delta / Math.max(0.008, (now - pointer.spinAt) / 1000), -6.8, 6.8);
        pointer.spinAt = now;
      }
    });

    canvas.addEventListener('pointerup', event => {
      if (event.pointerId !== pointer?.id) return;
      const { moved, tookOver } = pointer;
      pointer = null;
      if (moved || tookOver) return;
      const P = getParams();
      if (openVal > 0.5 && Math.abs(event.clientY - P.puddleY) < Math.max(20, 25 * P.unit)
        && Math.abs(event.clientX - P.cx) < P.waterRx + 12 * P.unit) {
        spawnWishStar(event.clientX);
      } else {
        toggleUmbrella();
      }
    });

    canvas.addEventListener('lostpointercapture', event => {
      if (event.pointerId === pointer?.id) pointer = null;
    });


    function strokePath(path, width, color) {
      ctx.save();
      ctx.lineCap = ctx.lineJoin = 'round';
      ctx.lineWidth = width;
      ctx.strokeStyle = color;
      ctx.stroke(path);
      ctx.restore();
    }

    function tracePoints(path, points, join = false) {
      const first = points[0];
      if (join) path.lineTo(first.x, first.y);
      else path.moveTo(first.x, first.y);
      for (let i = 1; i < points.length; i++) path.lineTo(points[i].x, points[i].y);
    }

    function linePath(points) {
      const path = new Path2D();
      tracePoints(path, points);
      return path;
    }

    function drawEllipse(x, y, rx, ry, color) {
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const density = Math.min(window.devicePixelRatio || 1, 2);
      dockCeiling = height - dock.offsetHeight - (parseFloat(getComputedStyle(dock).bottom) || 0);
      if (W === width && H === height && dpr === density) return;
      W = width;
      H = height;
      dpr = density;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      makePaper();
    }

    function makePaper() {
      const scale = Math.min(1, 1600 / Math.max(canvas.width, canvas.height));
      const width = background.width = inkGrain.width = Math.max(1, Math.round(canvas.width * scale));
      const height = background.height = inkGrain.height = Math.max(1, Math.round(canvas.height * scale));
      const painter = background.getContext('2d', { alpha: false });
      const ink = inkGrain.getContext('2d');
      const paper = painter.createImageData(width, height);
      const grain = ink.createImageData(width, height);
      const random = seededRandom(14892);
      const inkRandom = seededRandom(8093);
      const warp = Array.from({ length: width }, (_, i) => (
        1.15 * Math.sin(i * 1.29 + 0.66 * Math.sin(i * 0.047)) + 1.62 * (random() - 0.5)
      ));
      const weft = Array.from({ length: height }, (_, i) => (
        1.15 * Math.sin(i * 1.12 + 0.58 * Math.cos(i * 0.062)) + 1.52 * (random() - 0.5)
      ));
      const inkBands = warp.map((_, x) => 0.25 * Math.sin(x * 1.32));
      for (let y = 0; y < height; y++) {
        const dy = ((y / height * 400 - 177) / 213) * 0.89;
        const inkRow = Math.sin(y * 1.07);
        for (let x = 0; x < width; x++) {
          const dx = (x / width - 0.5) * (640 / 327);
          const distanceSquared = dx * dx + dy * dy;
          const centerLight = Math.exp(-3 * distanceSquared);
          const vignette = clamp((Math.sqrt(distanceSquared) - 0.46) * 1.18, 0, 1);
          const threads = warp[x] * (0.58 + 0.42 * Math.sin(y * 0.077 + x * 0.044))
            + weft[y] * (0.60 + 0.40 * Math.cos(x * 0.065 - y * 0.033));
          const clouds = 0.65 * Math.sin(x * 0.012 + y * 0.024) * Math.cos(y * 0.012 - x * 0.007)
            + 0.55 * Math.sin(x * 0.052 + Math.sin(y * 0.032)) * Math.cos(y * 0.093);
          const value = threads + clouds + (random() - 0.5) * 4.8;
          const i = (y * width + x) * 4;
          paper.data[i] = 18 + 10 * centerLight - 8 * vignette + 0.88 * value;
          paper.data[i + 1] = 12 + 7 * centerLight - 6 * vignette + 0.75 * value;
          paper.data[i + 2] = 34 + 20 * centerLight - 13 * vignette + 1.17 * value;
          paper.data[i + 3] = 255;

          const inkValue = inkRandom() * 2 - 1 + inkBands[x] * inkRow;
          const light = inkValue > 0;
          grain.data[i] = light ? 225 : 11;
          grain.data[i + 1] = light ? 205 : 4;
          grain.data[i + 2] = light ? 250 : 20;
          grain.data[i + 3] = Math.pow(Math.abs(inkValue), 1.23) * (light ? 6 : 13);
        }
      }
      painter.putImageData(paper, 0, 0);
      ink.putImageData(grain, 0, 0);

      painter.save();
      painter.lineCap = 'round';
      painter.lineWidth = 0.68;
      const fibers = [new Path2D(), new Path2D()];
      for (let i = 0; i < 5400; i++) {
        const x = random() * width;
        const y = random() * height;
        const length = 0.44 + random() * 5.2;
        const upright = random() > 0.53;
        const path = fibers[Number(i % 3 === 0)];
        path.moveTo(x, y);
        path.lineTo(x + (upright ? 0.24 : length), y + (upright ? length : 0.26));
      }
      painter.strokeStyle = 'rgba(184,153,232,.027)';
      painter.stroke(fibers[0]);
      painter.strokeStyle = 'rgba(4,1,13,.14)';
      painter.stroke(fibers[1]);
      painter.restore();
    }

    function getParams() {
      const portrait = smoothstep(1, 1.6, H / W);
      const sidePoetry = H < 460 && W >= 800;
      const baseApexY = H * lerp(0.14, 0.280, portrait);
      const waterLine = H * lerp(0.85, 0.745, portrait);
      const dockGap = 7;
      const fitHeight = (sceneHeight, poemHeight = 0) => Math.min(
        (waterLine - baseApexY - poemHeight) / sceneHeight,
        (dockCeiling - dockGap - baseApexY - poemHeight) / (sceneHeight + OPEN_WATER_RY)
      );
      // 矮屏把诗放到侧边，居中时在钩底与水面之间给四行诗预留高度。
      const heightUnit = sidePoetry ? fitHeight(280) : Math.min(fitHeight(315), fitHeight(272, 48));
      const unit = Math.min(W / lerp(366, 398, portrait), H / 432, Math.max(0.08, heightUnit));
      const e = clamp(openVal, 0, 1);
      const lift = smoothstep(0, 0.9, e);
      const breathing = motionPreference.matches ? 0 : lift;
      const pitch = lerp(0.028, OPEN_PITCH, lift) + breathing
        * (pitchExtra + 0.016 * Math.sin(time * 0.82 + 0.7) + 0.008 * Math.sin(time * 1.71));
      const roll = (motionPreference.matches ? 0 : -0.029) + breathing
        * (rollExtra + 0.027 * Math.sin(time * 0.70) + 0.013 * Math.sin(time * 1.43 + 1.1));
      const float = breathing * (2.4 * Math.sin(time * 0.94 + 0.45) + 0.8 * Math.sin(time * 1.68));
      const spread = Math.pow(waterOpen, 0.78);
      return {
        unit, e, portrait, sidePoetry, baseApexY, cx: W * 0.5, apexY: baseApexY + float * unit,
        cinch: 1 - smoothstep(0, 0.37, e),
        puddleY: Math.min(waterLine, dockCeiling - dockGap - OPEN_WATER_RY * unit),
        waterRx: lerp(29, 158, spread) * unit, waterRy: lerp(5.7, OPEN_WATER_RY, spread) * unit,
        cosP: Math.cos(pitch), sinP: Math.sin(pitch),
        cosR: Math.cos(roll), sinR: Math.sin(roll)
      };
    }

    const FOCAL_LENGTH = 1640;

    function project(x, y, z, P) {
      const vertical = y * P.cosP + z * P.sinP;
      const depth = z * P.cosP - y * P.sinP;
      const scale = P.unit * FOCAL_LENGTH / (FOCAL_LENGTH - depth);
      return {
        x: P.cx + (x * P.cosR - vertical * P.sinR) * scale,
        y: P.apexY + (x * P.sinR + vertical * P.cosR) * scale,
        depth
      };
    }

    function getHardware(P) {
      const axis = y => project(0, y, 0, P);
      const cos = Math.cos(rot), sin = Math.sin(rot);
      const handlePoint = (x, y) => project(x * cos, y, x * sin, P);
      const shaftEnd = axis(210);
      const hookY = 216;
      const handle = [axis(208), axis(hookY)];
      for (let i = 1; i <= 32; i++) {
        const a = Math.PI * i / 32;
        handle.push(handlePoint(12.4 * (1 - Math.cos(a)), hookY + 13.8 * Math.sin(a)));
      }
      const toeY = hookY - 3.5;
      const toe = handlePoint(24.8, toeY);
      handle.push(toe);
      return {
        shaft: [axis(lerp(103, 43, P.e)), shaftEnd],
        finial: [axis(lerp(-17, -13, P.e)), axis(1.1)],
        runner: axis(lerp(127, 79, P.e)),
        handle,
        // 比较钩尖与同高度中杆的相机深度，重叠时近的一侧在上。
        handleInFront: toe.depth >= axis(toeY).depth
      };
    }

    function drawEnamel(points, unit, width) {
      const path = linePath(points);
      strokePath(path, width * unit, ENAMEL);
      ctx.save();
      ctx.translate(-width * unit * 0.19, -width * unit * 0.04);
      strokePath(path, width * unit * 0.24, HARDWARE_GLINT);
      ctx.restore();
    }

    function drawHardware(geo, P) {
      const { shaft, finial, handle, handleInFront } = geo;
      if (!handleInFront) drawEnamel(handle, P.unit, 2.7);
      drawEnamel(shaft, P.unit, 1.6);
      if (handleInFront) drawEnamel(handle, P.unit, 2.7);
      const x = finial[0].x;
      const ink = ctx.createLinearGradient(x - 1.1 * P.unit, 0, x + 1.1 * P.unit, 0);
      ink.addColorStop(0, '#66459D');
      ink.addColorStop(0.43, '#A384D7');
      ink.addColorStop(1, '#6D4AA7');
      strokePath(linePath(finial), lerp(2, 1.7, P.e) * P.unit, ink);
    }

    function hemScallop(angle, firstRib) {
      const rib = (angle - firstRib) / RIB_STEP;
      const wave = Math.sin(Math.PI * (rib - Math.floor(rib)));
      return wave ** 2 / (0.26 + 0.74 * wave);
    }

    function canopyWorld(t, angle, scallop, P) {
      const sine = Math.sin(angle);
      const sideBlend = lerp(0.36, 1, smoothstep(0, 0.62, Math.abs(sine)));
      const hemDepth = 5 + 2.2 * sine ** 2 / Math.hypot(sine, 0.16);
      const unfoldedY = 70 * (0.65 * t ** 1.52 + 0.35 * t ** 3.2)
        - sideBlend * hemDepth * scallop * t ** 4;
      const foldedY = (145 - 3.6 * scallop) * t;
      const foldedR = 16.4 * t ** 1.36 * (1 - 0.105 * scallop);
      const pinch = 1 - 0.21 * P.cinch * Math.exp(-(((t - 0.79) / 0.097) ** 2));
      const r = lerp(foldedR, (165 - 2.8 * scallop) * t, P.e) * pinch;
      return { x: r * Math.cos(angle), y: lerp(foldedY, unfoldedY, P.e), z: r * sine };
    }

    function eyeFacing(angle, P) {
      const t = 0.74;
      const point = canopyWorld(t, angle, 1, P);
      const alongRib = canopyWorld(t + 0.001, angle, 1, P);
      const aroundRim = canopyWorld(t, angle + 0.001, 1, P);
      const ax = alongRib.x - point.x, ay = alongRib.y - point.y, az = alongRib.z - point.z;
      const bx = aroundRim.x - point.x, by = aroundRim.y - point.y, bz = aroundRim.z - point.z;
      const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
      const vx = -point.x, vy = -FOCAL_LENGTH * P.sinP - point.y;
      const vz = FOCAL_LENGTH * P.cosP - point.z;
      return (nx * vx + ny * vy + nz * vz) / (Math.hypot(nx, ny, nz) * Math.hypot(vx, vy, vz));
    }

    function hemTurn(sample, angle, sign) {
      let low = angle - 0.36, high = angle + 0.36;
      for (let i = 0; i < 17; i++) {
        const a = (2 * low + high) / 3;
        const b = (low + 2 * high) / 3;
        if (sign * sample(1, a).x < sign * sample(1, b).x) low = a;
        else high = b;
      }
      return (low + high) / 2;
    }

    function getCanopy(P) {
      const firstRib = rot + 0.15;
      const sample = (t, angle) => {
        const point = canopyWorld(t, angle, hemScallop(angle, firstRib), P);
        return project(point.x, point.y, point.z, P);
      };
      // 在伞檐投影折返点拆分扇片，遮挡顺序与曲面着色各自连续。
      const right = hemTurn(sample, 0, 1);
      const left = hemTurn(sample, Math.PI, -1);
      const isFront = angle => wrapAngle(angle - right) < left - right;
      const frontFade = angle => {
        const offset = wrapAngle(angle - right);
        return smoothstep(0, 0.16, Math.min(offset, left - right - offset));
      };
      const rear = [], front = [], ribs = [];
      const band = P.cinch > 0 ? getCinchBand(right, left, firstRib, P) : null;

      for (let i = 0; i < NUM_RIBS; i++) {
        const from = firstRib + i * RIB_STEP;
        const to = from + RIB_STEP;
        const splits = [from, to];
        for (const turn of [right, left]) {
          const seam = turn + TAU * Math.ceil((from - turn) / TAU);
          if (from < seam && seam < to) splits.splice(1, 0, seam);
        }
        const face = smoothstep(-0.24, 0.32, eyeFacing((from + to) / 2, P));
        const side = Math.cos((from + to) / 2);
        const rail = Array.from({ length: 19 }, (_, k) => sample(k / 18, from));
        ribs.push({ angle: from, rail, join: rail[15], tip: rail.at(-1) });

        for (let j = 1; j < splits.length; j++) {
          const start = splits[j - 1], end = splits[j];
          const mid = (start + end) / 2;
          const edge = Array.from({ length: 13 }, (_, k) => sample(1, lerp(start, end, k / 12)));
          const outward = Array.from({ length: 16 }, (_, k) => sample(k / 15, start));
          const inward = Array.from({ length: 16 }, (_, k) => sample(1 - k / 15, end));
          const rim = linePath(edge);
          const panel = linePath(outward);
          tracePoints(panel, edge, true);
          tracePoints(panel, inward, true);
          panel.closePath();
          const layer = isFront(mid) ? front : rear;
          layer.push({ panel, rim, face, side, odd: i % 2, depth: edge[6].depth });
        }
      }
      rear.sort((a, b) => a.depth - b.depth);
      front.sort((a, b) => a.depth - b.depth);
      return { rear, front, ribs, band, isFront, frontFade };
    }

    function getCinchBand(right, left, firstRib, P) {
      const waistY = canopyWorld(0.79, Math.PI / 2, 0.5, P).y;
      return Array.from({ length: 25 }, (_, i) => {
        const angle = lerp(right, left, i / 24);
        const scallop = hemScallop(angle, firstRib);
        let low = 0.73, high = 0.85;
        // 沿伞布等高线系束带，布褶的檐尖高度不会投射到带上。
        for (let j = 0; j < 10; j++) {
          const t = (low + high) / 2;
          if (canopyWorld(t, angle, scallop, P).y < waistY) low = t;
          else high = t;
        }
        const point = canopyWorld((low + high) / 2, angle, scallop, P);
        return project(point.x, point.y, point.z, P);
      });
    }

    function blendInk(inner, outer, amount) {
      return 'rgb(' + inner.map((channel, i) => Math.round(lerp(channel, outer[i], amount))).join(',') + ')';
    }

    function paintPanels(pieces, P) {
      const u = P.unit;
      const fold = 1 - smoothstep(0, 0.45, P.e);
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineWidth = 0.24 * u;
      for (const { panel, rim, face, side, odd } of pieces) {
        const ink = ctx.createLinearGradient(P.cx + lerp(46, 5, fold) * side * u, P.apexY - u,
          P.cx + lerp(26, 4, fold) * side * u, P.apexY + lerp(lerp(83, 74, face), 125, fold) * u);
        const shade = (lining, fabric, folded) => blendInk(
          lining.map((channel, i) => lerp(channel, fabric[i], face)), folded, fold);
        ink.addColorStop(0, shade([113, 80, 183], [107, 73, 176], [105, 72, 173]));
        ink.addColorStop(lerp(0.58, 0.44, face), shade([132, 103, 195],
          odd ? [98, 64, 171] : [85, 53, 153], odd ? [111, 77, 179] : [89, 56, 148]));
        ink.addColorStop(1, shade(odd ? [171, 144, 229] : [154, 126, 215],
          odd ? [91, 58, 156] : [77, 46, 138], odd ? [93, 62, 158] : [77, 46, 133]));
        ctx.fillStyle = ctx.strokeStyle = ink;
        ctx.fill(panel);
        ctx.stroke(panel);
        strokePath(rim, lerp(0.59, 0.56, face) * u, 'rgba(224,202,253,.43)');
      }
      ctx.restore();
    }

    function drawCinch(band, P) {
      if (!band) return;
      const ink = ctx.createLinearGradient(band[0].x, 0, band.at(-1).x, 0);
      ink.addColorStop(0, 'rgba(157,123,215,.27)');
      ink.addColorStop(0.46, 'rgba(224,205,252,.80)');
      ink.addColorStop(1, 'rgba(181,147,235,.43)');
      ctx.save();
      ctx.globalAlpha = P.cinch;
      strokePath(linePath(band), 1.18 * P.unit * P.cinch, ink);
      ctx.restore();
    }

    function drawFrame(canopy, hardware, P) {
      const { ribs, rear } = canopy;
      const { runner } = hardware;
      ctx.save();
      const lining = new Path2D();
      for (const { panel } of rear) lining.addPath(panel);
      ctx.clip(lining);
      for (const { rail, join, angle } of ribs) {
        const stay = new Path2D();
        stay.moveTo(runner.x, runner.y);
        stay.quadraticCurveTo((runner.x + join.x) / 2,
          (runner.y + join.y) / 2 - Math.abs(join.x - runner.x) * 0.029, join.x, join.y);
        strokePath(stay, 0.65 * P.unit, 'rgba(215,196,255,.38)');
        const light = smoothstep(0, 0.24, Math.abs(Math.sin(angle)));
        strokePath(linePath(rail), 0.8 * P.unit, 'rgba(232,218,255,' + 0.60 * light + ')');
      }
      ctx.restore();
      drawEnamel([{ x: runner.x, y: runner.y - 1.45 * P.unit },
        { x: runner.x, y: runner.y + 1.75 * P.unit }], P.unit, 2.7);
    }

    function getDew(canopy, P) {
      const fade = smoothstep(0.19, 0.78, P.e);
      const ornaments = [];
      if (!fade) return ornaments;
      for (const [i, thread] of THREADS.entries()) {
        const { length, slant, size, kind, color, flare, lag, flareVel, lagVel } = thread;
        const { angle, tip } = canopy.ribs[i];
        const world = canopyWorld(1, angle, 0, P);
        const radial = length * Math.sin(flare) * Math.cos(lag + slant);
        const tangential = length * Math.sin(lag + slant);
        const hang = length * Math.cos(flare) * Math.cos(lag + slant);
        const cos = Math.cos(angle), sin = Math.sin(angle);
        const dx = radial * cos - tangential * sin;
        const dz = radial * sin + tangential * cos;
        const end = project(world.x + dx, world.y + hang, world.z + dz, P);
        // 丝线中段比星坠略早跟上风势，甩动和回摆时会出现柔和弧线。
        const radialBend = clamp(flareVel * 0.045, -0.24, 0.24) * length;
        const tangentBend = clamp(lagVel * 0.06, -0.29, 0.29) * length;
        const bend = project(world.x + dx * 0.46 + radialBend * cos - tangentBend * sin,
          world.y + hang * 0.56, world.z + dz * 0.46 + radialBend * sin + tangentBend * cos, P);
        const front = canopy.isFront(angle);
        const pulse = motionPreference.matches ? 0.86 : 0.83 + 0.15 * Math.sin(time * 2.4 + i * 2.6);
        ornaments.push({ tip, bend, end, color, depth: bend.depth, front, fade });
        const rotation = lag * 0.62 + clamp(lagVel * 0.05, -0.25, 0.25);
        ornaments.push({ end, size, kind, color, rotation, depth: end.depth, front, fade: fade * pulse });
      }
      return ornaments.sort((a, b) => a.depth - b.depth);
    }

    function drawDew(ornaments, front, P) {
      ctx.save();
      for (const { tip, bend, end, size, kind, color, rotation, front: near, fade } of ornaments) {
        if (front !== near) continue;
        ctx.globalAlpha = fade;
        if (tip) {
          const thread = ctx.createLinearGradient(tip.x, tip.y, end.x, end.y);
          thread.addColorStop(0, 'rgba(229,203,255,.17)');
          thread.addColorStop(1, color + 'A0');
          const path = new Path2D();
          path.moveTo(tip.x, tip.y);
          path.quadraticCurveTo(bend.x, bend.y, end.x, end.y);
          strokePath(path, 0.48 * P.unit, thread);
        } else {
          drawStarShape(end.x, end.y, size * P.unit, kind, rotation, color);
        }
      }
      ctx.restore();
    }

    function drawUmbrella(canopy, hardware, P) {
      paintPanels(canopy.rear, P);
      drawDew(canopy.dew, false, P);
      drawHardware(hardware, P);
      const frameLight = smoothstep(0.02, 0.42, P.e);
      if (frameLight) {
        ctx.save();
        ctx.globalAlpha = frameLight;
        drawFrame(canopy, hardware, P);
        ctx.restore();
      }
      paintPanels(canopy.front, P);
      for (const { angle, rail } of canopy.ribs) {
        const light = canopy.frontFade(angle);
        if (light) strokePath(linePath(rail), lerp(0.58, 0.73, P.cinch) * P.unit,
          'rgba(220,197,255,' + lerp(0.25, 0.43, P.cinch) * light + ')');
      }
      drawCinch(canopy.band, P);
      drawDew(canopy.dew, true, P);
    }

    function posePoetry(P, hardware) {
      const fs = clamp(8.5 * P.unit, P.sidePoetry ? 9 : 10, 19);
      const english = fs + 'px "Courier New", monospace';
      const chinese = fs + 'px "Songti SC", "SimSun", "Microsoft YaHei", serif';
      const lineHeight = fs * 1.24;
      const spacing = Math.max(0.13, 0.28 * P.unit) + 'px';
      if (!P.sidePoetry) {
        const handleBottom = Math.max(...hardware.handle.map(point => point.y)) + 1.35 * P.unit;
        const top = handleBottom + 9 * P.unit + fs / 2;
        const bottom = P.puddleY - P.waterRy - 6 * P.unit - fs / 2 - 3 * lineHeight;
        const y = clamp(H * lerp(0.6775, 0.58, P.portrait), top, Math.max(top, bottom));
        return { x: P.cx, y, lineHeight, spacing, english, chinese };
      }

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.letterSpacing = spacing;
      const metrics = [];
      for (const [font, lines] of [[english, CONFIG.poemLines], [chinese, CONFIG.wishEasterEggLines]]) {
        ctx.font = font;
        for (const line of lines) metrics.push(ctx.measureText(line));
      }
      ctx.restore();

      const halfWidth = Math.max(...metrics.map(m => Math.max(m.actualBoundingBoxLeft, m.actualBoundingBoxRight)));
      const ascent = Math.max(...metrics.map(m => m.actualBoundingBoxAscent));
      const descent = Math.max(...metrics.map(m => m.actualBoundingBoxDescent));
      const rightOfPuddle = P.cx + 158 * P.unit + 12;
      const top = Math.max(58, P.baseApexY + 106 * P.unit);
      const bottom = dockCeiling - 5;
      const y = clamp(H * 0.48, top + ascent, bottom - descent - lineHeight * 3);
      return { x: Math.min(rightOfPuddle + halfWidth, W - halfWidth - 12), y, lineHeight, spacing, english, chinese };
    }

    function drawPoetry(P, hardware) {
      const { x, y, lineHeight, spacing, english, chinese } = posePoetry(P, hardware);
      const presence = appState === 'intro' ? smoothstep(0.2, 1.65, introClock) : 1;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.letterSpacing = spacing;
      ctx.font = english;
      ctx.globalAlpha = presence * (1 - smoothstep(0, 0.56, poemBlend)) * 0.51;
      ctx.fillStyle = '#DCCAFF';
      if (ctx.globalAlpha) CONFIG.poemLines.forEach((line, i) => ctx.fillText(line, x, y + i * lineHeight));
      ctx.font = chinese;
      ctx.globalAlpha = presence * smoothstep(0.44, 1, poemBlend) * 0.75;
      ctx.fillStyle = '#F5DDB7';
      if (ctx.globalAlpha) CONFIG.wishEasterEggLines.forEach((line, i) => ctx.fillText(line, x, y + i * lineHeight));
      ctx.restore();
    }

    function drawStarShape(x, y, size, kind, rotation, color) {
      if (kind === 0) {
        drawEllipse(x, y, size * 0.76, size, color);
        return;
      }
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.beginPath();
      if (kind === 4) {
        ctx.moveTo(0, -size);
        ctx.quadraticCurveTo(size * 0.17, -size * 0.19, size * 0.74, 0);
        ctx.quadraticCurveTo(size * 0.18, size * 0.18, 0, size);
        ctx.quadraticCurveTo(-size * 0.17, size * 0.18, -size * 0.74, 0);
        ctx.quadraticCurveTo(-size * 0.17, -size * 0.19, 0, -size);
      } else {
        ctx.moveTo(0, -size);
        for (let i = 1; i < 16; i++) {
          const a = i * TAU / 16;
          const radius = size * (i % 2 ? 0.23 : i % 4 ? 0.62 : 1);
          ctx.lineTo(Math.sin(a) * radius * 0.83, -Math.cos(a) * radius);
        }
      }
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function makeWaterPaint() {
      const surface = document.createElement('canvas');
      surface.width = 640;
      surface.height = 96;
      const painter = surface.getContext('2d');
      const random = seededRandom(1426);
      painter.save();
      painter.translate(320, 48);
      painter.scale(318, 46);
      const wash = painter.createRadialGradient(-0.18, -0.25, 0.1, 0, 0, 1.08);
      wash.addColorStop(0, '#7A58BE');
      wash.addColorStop(0.36, '#714BBD');
      wash.addColorStop(0.73, '#6240AB');
      wash.addColorStop(1, '#523397');
      painter.beginPath();
      painter.arc(0, 0, 1, 0, TAU);
      painter.fillStyle = wash;
      painter.fill();
      painter.clip();
      for (let i = 0; i < 88; i++) {
        const x = (random() - 0.5) * 2.3, y = (random() - 0.5) * 2.3;
        const r = 0.025 + random() * 0.23;
        const cloud = painter.createRadialGradient(x, y, 0, x, y, r);
        const tint = i % 3 ? '183,144,248' : '30,14,75';
        cloud.addColorStop(0, 'rgba(' + tint + ',' + (0.018 + random() * 0.077) + ')');
        cloud.addColorStop(1, 'rgba(' + tint + ',0)');
        painter.fillStyle = cloud;
        painter.fillRect(x - r, y - r, r * 2, r * 2);
      }
      for (let i = 0; i < 248; i++) {
        const angle = random() * TAU, r = Math.sqrt(random()) * 0.95;
        const opacity = 0.06 + random() * 0.22;
        painter.beginPath();
        painter.ellipse(Math.cos(angle) * r, Math.sin(angle) * r,
          (0.21 + random() * (i % 7 === 0 ? 1.45 : 0.42)) / 158,
          (0.19 + random() * 0.22) / 23.1, 0, 0, TAU);
        painter.fillStyle = 'rgba(224,196,255,' + opacity + ')';
        painter.fill();
      }
      painter.restore();
      return surface;
    }

    const waterPaint = makeWaterPaint();

    function drawPuddle(P) {
      const { cx: x, puddleY: y, waterRx: rx, waterRy: ry, unit } = P;
      ctx.drawImage(waterPaint, x - rx * 320 / 318, y - ry * 48 / 46,
        rx * 640 / 318, ry * 96 / 46);
      const outline = new Path2D();
      outline.ellipse(x, y, rx, ry, 0, 0, TAU);
      strokePath(outline, 0.53 * unit, 'rgba(212,190,255,.42)');
      const reflection = new Path2D();
      reflection.ellipse(x, y + 0.12 * unit, rx - 0.8 * unit, ry - 0.6 * unit, 0, 0.12, 2.78);
      strokePath(reflection, 0.43 * unit, 'rgba(223,200,255,.19)');

      ctx.save();
      ctx.clip(outline);
      for (const impact of impacts) drawRipples(impact, P);
      ctx.restore();
    }


    function spawnStar(canopy, P, wish, xHint, random = Math.random) {
      const rimY = canopy ? Math.max(...canopy.ribs.map(rib => rib.tip.y)) : P.apexY + 70 * P.unit;
      const limit = Math.min(lerp(16, 147, P.e), 0.93 * P.waterRx / P.unit);
      const x = xHint === undefined ? (random() * 2 - 1) * limit : clamp((xHint - P.cx) / P.unit, -limit, limit);
      const u = x * P.unit / P.waterRx;
      const weight = random();
      const profile = weight < 0.40 ? RAIN_DUST : weight < 0.84 ? RAIN_STAR : RAIN_SPARK;
      const kind = wish ? 8 : profile === RAIN_DUST ? 0 : profile === RAIN_SPARK && random() < 0.52 ? 8 : 4;
      const duration = wish ? 0.96 : lerp(...profile.duration, random());
      const star = {
        x,
        y: (rimY - P.baseApexY) / P.unit + 7 + random() * 15,
        v: (random() - 0.50) * 1.5 * Math.sqrt(1 - u ** 2),
        elapsed: 0,
        duration: appState === 'intro' && !wish ? Math.min(duration, INTRO.lastLanding - introClock) : duration,
        size: wish ? 6.8 : lerp(...profile.size, random()),
        tail: wish ? 32 : lerp(...profile.tail, random()),
        brightness: wish ? 1 : profile.brightness,
        kind,
        phase: random() * TAU,
        flicker: 1.6 + random() * 2.8,
        color: wish ? WISH_COLOR : STAR_COLORS[Math.floor(random() * STAR_COLORS.length)],
        wish
      };
      stars.push(star);
      return star;
    }

    function seedRain(canopy, P, spread = 1) {
      const random = seededRandom(2211);
      const count = 32;
      for (let i = 0; i < count; i++) {
        const star = spawnStar(canopy, P, false, undefined, random);
        star.elapsed = star.duration * lerp(-(1 - spread) * 0.43, spread, (i + 0.7) / (count + 1));
      }
    }

    function spawnWishStar(xHint) {
      const P = getParams();
      spawnStar(P.e > 0.45 ? getCanopy(P) : null, P, true, xHint);
      wishCount++;
      audio.playWishLaunch();
    }

    function addImpact({ x, v, wish }, elapsed = 0, size = 1) {
      const rayCount = wish ? 13 : 6;
      const dropCount = wish ? 16 : 8;
      const particle = (angle, speed, radius) => ({
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius,
        color: wish && Math.random() > 0.49 ? '#FFE5AC' : Math.random() > 0.44 ? '#F3DEFF' : '#CEAFFE'
      });
      const rays = Array.from({ length: rayCount }, (_, i) => particle(
        -Math.PI * (0.08 + 0.84 * (i + Math.random()) / rayCount),
        (wish ? 78 : 58) + Math.random() * (wish ? 69 : 52),
        (wish ? 10 : 6) + Math.random() * (wish ? 12 : 8)
      ));
      const drops = Array.from({ length: dropCount }, () => particle(
        -Math.PI * (0.12 + Math.random() * 0.76),
        (wish ? 64 : 35) + Math.random() * (wish ? 73 : 50),
        (wish ? 0.56 : 0.26) + Math.random() * (wish ? 0.88 : 0.53)
      ));
      impacts.push({ x, v, wish, elapsed, size, rays, drops });
    }

    function drawRipples(impact, P) {
      const { x: sceneX, v, wish, elapsed, size } = impact;
      const x = P.cx + sceneX * P.unit, y = P.puddleY + v * P.waterRy;
      const rings = wish ? 4 : 3;
      ctx.save();
      ctx.strokeStyle = wish ? '#FFE9BE' : '#DAC0FE';
      for (let j = 0; j < rings; j++) {
        const t = (elapsed - 0.077 * j) / (wish ? 0.77 : 0.64);
        if (t < 0 || t >= 1) continue;
        const r = (1.5 + (wish ? 43 : 24) * (1 - (1 - t) ** 1.45)) * P.unit * size;
        ctx.globalAlpha = (1 - t) ** 1.22 * (wish ? 0.79 : 0.45) * (1 - j * 0.14);
        ctx.lineWidth = (wish ? 0.70 : 0.48) * P.unit;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * 0.29, 0, 0, TAU - j * 0.52);
        ctx.stroke();
      }
      if (elapsed < 0.24) {
        ctx.globalAlpha = (1 - elapsed / 0.24) * (wish ? 0.84 : 0.56);
        drawEllipse(x, y, (wish ? 4.2 : 1.65) * P.unit * size, 0.52 * P.unit,
          wish ? '#FFF0BC' : '#F8E7FF');
      }
      ctx.restore();
    }

    function drawSplashes(P) {
      const gravity = 235;
      ctx.save();
      for (const { x: sceneX, v, wish, elapsed, size, rays, drops } of impacts) {
        const life = 1 - elapsed / (wish ? 0.78 : 0.58);
        if (life <= 0) continue;
        const ox = P.cx + sceneX * P.unit, oy = P.puddleY + v * P.waterRy;
        const scale = size * P.unit;
        const rise = 0.5 * gravity * elapsed ** 2;

        for (const ray of rays) {
          const dy = ray.vy * elapsed + rise;
          if (dy >= 0) continue;
          const x = ox + ray.vx * elapsed * scale, y = oy + dy * scale;
          const vy = ray.vy + gravity * elapsed;
          const speed = Math.hypot(ray.vx, vy);
          const dx = ray.vx / speed, dyDir = vy / speed;
          const length = Math.min(ray.radius, elapsed * speed) * scale;
          const width = (wish ? 1.15 : 0.80) * scale * life;
          const bx = x - dx * length, by = Math.min(oy, y - dyDir * length);
          ctx.globalAlpha = life ** 1.25 * (wish ? 0.90 : 0.72);
          ctx.fillStyle = ray.color;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(lerp(bx, x, 0.38) - dyDir * width, lerp(by, y, 0.38) + dx * width, x, y);
          ctx.quadraticCurveTo(lerp(bx, x, 0.34) + dyDir * width, lerp(by, y, 0.34) - dx * width, bx, by);
          ctx.fill();
        }

        for (const drop of drops) {
          const dy = drop.vy * elapsed + rise;
          if (dy >= 0) continue;
          const x = ox + drop.vx * elapsed * scale, y = oy + dy * scale;
          ctx.globalAlpha = life * (wish ? 0.85 : 0.64);
          drawEllipse(x, y, drop.radius * scale * 0.74, drop.radius * scale, drop.color);
        }
      }
      ctx.restore();
    }

    function updateRain(dt, canopy, P, raining) {
      for (let i = impacts.length - 1; i >= 0; i--) {
        impacts[i].elapsed += dt;
        if (impacts[i].elapsed >= 1) impacts.splice(i, 1);
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        const star = stars[i];
        star.elapsed += dt;
        if (star.elapsed < star.duration) continue;
        addImpact(star, 0, lerp(0.28, 1, P.e));
        const pan = clamp(star.x * P.unit / P.waterRx, -1, 1) * 0.8;
        if (star.wish) audio.playWishImpact(pan);
        else audio.playStarSplash(pan);
        stars.splice(i, 1);
      }

      if (!raining) {
        starSpawnAcc = 0;
        return;
      }
      const intro = appState === 'intro';
      const rate = motionPreference.matches ? 14 : 18.4 + Math.abs(omega) * 2.65;
      const taper = intro ? 1 - smoothstep(INTRO.rainTaperStart, INTRO.rainEnd, introClock) : 1;
      if (intro && !introRainSeeded) {
        seedRain(canopy, P, 0.32);
        introRainSeeded = true;
      }
      starSpawnAcc += dt * rate * taper;
      while (starSpawnAcc >= 1) {
        starSpawnAcc--;
        spawnStar(canopy, P, false, undefined, intro ? introRandom : Math.random);
      }
    }

    function drawRain(P) {
      const u = P.unit;
      ctx.save();
      ctx.lineCap = 'round';
      for (const star of stars) {
        const t = star.elapsed / star.duration;
        if (t <= 0) continue;
        const x = P.cx + star.x * u;
        const y = lerp(P.baseApexY + star.y * u, P.puddleY + star.v * P.waterRy, t * (0.72 + 0.28 * t));
        const tx = x;
        const ty = y - star.tail * u * smoothstep(0, 0.22, t);
        const pulse = 0.78 + 0.20 * Math.sin(time * star.flicker + star.phase);
        ctx.globalAlpha = star.brightness * pulse * smoothstep(0, 0.08, t);
        if (ctx.globalAlpha <= 0.01) continue;

        const tail = ctx.createLinearGradient(x, y, tx, ty);
        tail.addColorStop(0, star.color + 'A6');
        tail.addColorStop(0.42, star.color + '26');
        tail.addColorStop(1, star.color + '00');
        ctx.strokeStyle = tail;
        ctx.lineWidth = (star.wish ? 0.93 : 0.37 + 0.09 * star.size) * u;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(tx, ty);
        ctx.stroke();

        const radius = Math.max(1.45, star.size * (star.wish ? 2 : 1.62)) * u;
        const halo = ctx.createRadialGradient(x, y, 0, x, y, radius);
        halo.addColorStop(0, star.color + (star.wish ? '66' : '38'));
        halo.addColorStop(1, star.color + '00');
        drawEllipse(x, y, radius, radius, halo);
        drawStarShape(x, y, star.size * u, star.kind, Math.sin(star.phase) * 0.16, star.color);
      }
      ctx.restore();
    }

    function idleSpin() {
      return targetOpen && !motionPreference.matches ? 0.22 : 0;
    }

    function resetThreads() {
      for (const thread of THREADS) thread.flare = thread.flareVel = thread.lag = thread.lagVel = 0;
    }

    function updateThreads(dt) {
      if (!dt || motionPreference.matches) return;
      const flareTarget = Math.atan(0.037 * omega ** 2);
      const lagTarget = clamp(-0.065 * omega - 0.095 * angularAccel, -1.10, 1.10);
      const wind = 1 - 0.45 * smoothstep(0.4, 5.9, Math.abs(omega));
      const steps = Math.ceil(dt * 120);
      const step = dt / steps;
      for (const thread of THREADS) {
        const f = thread.frequency;
        const g = f * 0.86;
        const breeze = wind * thread.windStrength;
        const phase = thread.windPhase;
        const radial = flareTarget + breeze * (0.44 + 0.57 * Math.sin(time * 2.1 + phase)
          + 0.26 * Math.sin(time * 4.3 - phase * 1.3));
        const tangent = lagTarget + breeze * (Math.sin(time * 2.8 + phase)
          + 0.37 * Math.sin(time * 5.1 + phase * 0.7));
        for (let i = 0; i < steps; i++) {
          thread.flareVel += (f ** 2 * (radial - thread.flare) - 0.93 * f * thread.flareVel) * step;
          thread.lagVel += (g ** 2 * (tangent - thread.lag) - 0.78 * g * thread.lagVel) * step;
          thread.flare += thread.flareVel * step;
          thread.lag += thread.lagVel * step;
        }
      }
    }

    function updateUmbrella(dt, now) {
      if (appState === 'intro') {
        updateIntro(dt);
      } else {
        if (!pointer) {
          omega = lerp(omega, idleSpin(), 1 - Math.exp(-1.23 * dt));
          const spin = targetOpen ? 1 : smoothstep(0.012, 0.26, openVal);
          rot = wrapAngle(rot + omega * spin * dt);
        } else if (now - pointer.spinAt > 46) {
          omega *= Math.exp(-9 * dt);
        }
        settleCanopy(dt);
      }
      if (!dt) return;

      const acceleration = clamp((omega - previousOmega) / dt, -65, 65);
      angularAccel = lerp(angularAccel, acceleration, 1 - Math.exp(-18 * dt));
      previousOmega = omega;
      updateThreads(dt);

      const turn = clamp(omega / 7.8, -1, 1);
      const pitchTarget = clamp(-0.044 * openVel, -0.086, 0.086)
        - 0.046 * Math.abs(turn) + 0.026 * turn * Math.cos(rot);
      const rollTarget = clamp(-0.016 * openVel, -0.031, 0.031)
        - 0.11 * turn + 0.035 * turn * Math.sin(rot);
      pitchExtra = lerp(pitchExtra, pitchTarget, 1 - Math.exp(-5.2 * dt));
      rollExtra = lerp(rollExtra, rollTarget, 1 - Math.exp(-(pointer ? 7.8 : 4.8) * dt));
    }

    function settleCanopy(dt) {
      // 交互时用临界阻尼弹簧接续开场结束或接管时的位移和速度。
      const rate = targetOpen ? 6.4 : 7.4;
      const offset = openVal - targetOpen;
      const slope = openVel + rate * offset;
      const decay = Math.exp(-rate * dt);
      openVal = clamp(targetOpen + (offset + slope * dt) * decay, 0, 1);
      openVel = (openVel - rate * slope * dt) * decay;
      if (Math.abs(targetOpen - openVal) < 0.00005 && Math.abs(openVel) < 0.0004) {
        openVal = targetOpen;
        openVel = 0;
      }
    }

    function updateIntro(dt) {
      const { openStart, spinStart, peakStart, coastStart, closeStart, end, peakSpeed } = INTRO;
      const t = introClock = Math.min(introClock + dt, end);
      introProgressFill.style.width = 100 * t / end + '%';
      if (t >= openStart) setTargetOpen(Number(t < closeStart));

      const opening = phase(openStart, spinStart, t);
      const closing = phase(closeStart, end, t);
      openVal = opening ** 2 * (3 - 2 * opening) - closing ** 2 * (3 - 2 * closing);
      openVel = 6 * (opening * (1 - opening) / (spinStart - openStart)
        - closing * (1 - closing) / (end - closeStart));

      // 对平滑升降速曲线积分，转角和角速度在每个阶段边界都连续。
      const rampArea = p => p ** 3 * (1 - p * 0.5);
      const accel = phase(spinStart, peakStart, t);
      const coast = phase(coastStart, closeStart, t);
      const spinAngle = peakSpeed * ((peakStart - spinStart) * rampArea(accel)
        + clamp(t - peakStart, 0, coastStart - peakStart)
        + (closeStart - coastStart) * (coast - rampArea(coast)));
      omega = peakSpeed * (smoothstep(spinStart, peakStart, t) - smoothstep(coastStart, closeStart, t));
      rot = wrapAngle(FOLDED_ROTATION + spinAngle);

      if (t >= end) enterInteractive();
    }

    function loop(now) {
      frameRequest = 0;
      if (!active || document.hidden) return;
      const elapsed = Math.max(0, (now - last) / 1000);
      const dt = Math.min(elapsed, 0.05);
      last = now;
      time += dt;

      updateUmbrella(dt, now);

      const showWish = Number(wishCount >= CONFIG.wishEasterEggCount);
      poemBlend = lerp(poemBlend, showWish, 1 - Math.exp(-1.55 * dt));
      const raining = targetOpen === 1 && openVal > 0.59
        && (appState !== 'intro' || introClock < INTRO.rainEnd);
      audio.updateContinuous({ dt, openVal, omega, rainActive: raining });

      // 手动收伞时让水洼托住仍在下落的星星，待它们触水后再缩小。
      waterOpen = Math.max(openVal, stars.length ? waterOpen : waterOpen - 2.7 * dt);
      const P = getParams();
      const canopy = getCanopy(P);
      canopy.dew = getDew(canopy, P);
      const hardware = getHardware(P);
      updateRain(dt, canopy, P, raining);
      ctx.drawImage(background, 0, 0, W, H);
      drawPoetry(P, hardware);
      drawPuddle(P);
      drawUmbrella(canopy, hardware, P);
      drawRain(P);
      drawSplashes(P);
      ctx.drawImage(inkGrain, 0, 0, W, H);
      frameRequest = requestAnimationFrame(loop);
    }

    function resumeFrame() {
      if (!active || document.hidden || frameRequest) return;
      last = performance.now();
      loop(last);
    }

    function pauseFrame() {
      cancelAnimationFrame(frameRequest);
      frameRequest = 0;
      if (pointer && canvas.hasPointerCapture(pointer.id)) canvas.releasePointerCapture(pointer.id);
      pointer = null;
    }

    function showExperience() {
      if (active) return;
      active = true;
      void enableSound();
      resize();
      startIntro();
      resumeFrame();
    }

    function stopExperience() {
      if (!active) return;
      active = false;
      soundRequested = soundUnlocked = false;
      pendingCanopySound = null;
      pauseFrame();
      pauseSound();
    }

    document.addEventListener('visibilitychange', () => {
      if (!active) return;
      if (document.hidden) {
        pauseFrame();
        soundRequested = soundUnlocked;
        pendingCanopySound = null;
        pauseSound();
      } else {
        resumeFrame();
        if (soundUnlocked || !audio.ctx) void enableSound();
      }
    });

    motionPreference.addEventListener('change', event => {
      if (!active || !event.matches) return;
      if (appState === 'intro') startIntro();
      else resetThreads();
    });

    window.addEventListener('resize', () => {
      if (active) resize();
    });
    if (window.parent !== window && new URLSearchParams(location.search).has('gallery')) {
      window.xmqRain = { start: showExperience, stop: stopExperience };
      document.querySelector('.xmq-home').addEventListener('click', event => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        window.parent.postMessage('xmq-rain-home', location.origin);
      });
    } else {
      showExperience();
    }

  </script>
</body>
</html>
