<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#171124" />
  <title>今夜，局部紫色流星雨 · 27</title>
  <meta name="description" content="撑开一把紫伞，让星星轻轻落进水面。一个可以触摸、许愿与安静欣赏的小小动画世界。" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #171124;
      color: #F3E8FF;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: pointer;
    }

    /* 顶部极简控制角标 */
    #top-controls {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 600ms ease;
    }

    #top-controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-pill {
      appearance: none;
      border: 1px solid rgba(196, 181, 253, 0.22);
      background: rgba(18, 10, 38, 0.54);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(233, 213, 255, 0.84);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, opacity 200ms ease;
    }

    .icon-pill:hover {
      background: rgba(91, 33, 182, 0.45);
      border-color: rgba(216, 180, 254, 0.45);
      color: #FAF5FF;
    }

    .icon-pill.muted {
      color: rgba(216, 180, 254, 0.48);
    }

    /* 底部自由交互胶囊（仅在开场动画落定后淡入） */
    #dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 750ms ease, transform 750ms ease;
    }

    #dock.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .dock-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border-radius: 999px;
      background: rgba(18, 10, 38, 0.66);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(196, 181, 253, 0.26);
      box-shadow: 0 10px 30px rgba(6, 2, 16, 0.42);
    }

    .dock-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(233, 213, 255, 0.88);
      font-size: 12.5px;
      letter-spacing: 0.05em;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, transform 150ms ease;
    }

    .dock-btn:hover {
      background: rgba(139, 92, 246, 0.26);
      color: #FAF5FF;
    }

    .dock-btn:active {
      transform: scale(0.96);
    }

    .dock-btn.primary {
      background: rgba(112, 82, 152, 0.82);
      color: #FAF5FF;
      font-weight: 500;
    }

    .dock-btn.primary:hover {
      background: rgba(130, 98, 170, 0.90);
    }

    .dock-btn.gold {
      color: #E6D2A9;
    }

    .dock-hint {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(216, 180, 254, 0.56);
      text-align: center;
      pointer-events: none;
    }

    /* 开场进度极细发丝线 */
    #intro-progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      z-index: 25;
      background: rgba(255, 255, 255, 0.05);
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease;
    }

    #intro-progress.visible {
      opacity: 1;
    }

    #intro-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #72569F, #B6A0D5, #E7D4B3);
    }

    /* 纯净壁纸模式（隐藏按钮，仅留右上角一个半透明恢复按钮） */
    body.zen-mode #dock,
    body.zen-mode #btn-sound,
    body.zen-mode #btn-bgm {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    body.zen-mode #btn-zen {
      opacity: 0.35;
    }
    body.zen-mode #btn-zen:hover {
      opacity: 0.9;
    }

    /* Navigation and interaction remain visually quiet. */
    .xmq-home {
      position: fixed; z-index: 40;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      display: inline-flex; align-items: center; min-height: 36px;
      padding: 0 10px; border: 1px solid rgba(233, 220, 250, .4);
      border-radius: 999px; background: rgba(35, 21, 55, .74);
      color: #f8efff; font: 12px/1 system-ui, sans-serif;
      text-decoration: none; gap: 5px;
    }
    .xmq-home:hover { background: #231537; }
    .xmq-home:focus-visible, button:focus-visible {
      outline: 2px solid #f8efff; outline-offset: 3px;
    }
    body.zen-mode .xmq-home { display: none; }
    #intro-hint {
      position: fixed; left: 0; right: 0;
      bottom: max(30px, env(safe-area-inset-bottom)); z-index: 19;
      color: rgba(233, 213, 255, .52); text-align: center;
      font-size: 11px; letter-spacing: .16em;
      opacity: 0; pointer-events: none; transition: opacity 600ms ease;
    }
    #intro-hint.visible { opacity: 1; }
    body.zen-mode #intro-hint { opacity: 0; }
    @media (max-width: 480px) {
      .xmq-home {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        min-height: 34px; font-size: 11px; padding: 0 9px;
      }
      #top-controls {
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right)); gap: 4px;
      }
      .icon-pill { min-height: 34px; font-size: 11px; padding: 7px 8px; }
      #dock { bottom: max(16px, env(safe-area-inset-bottom)); padding: 0 10px; }
      .dock-bar { max-width: calc(100vw - 20px); padding: 4px 5px; gap: 2px; }
      .dock-btn { min-height: 40px; font-size: 11.5px; padding: 10px 9px; }
      .dock-hint { max-width: 90vw; font-size: 10px; line-height: 1.5; }
    }
    @media (max-width: 360px) {
      .icon-pill { font-size: 10px; padding: 7px 6px; }
      .dock-btn { font-size: 11px; padding: 10px 7px; }
    }
    @media (max-height: 500px) {
      #dock { bottom: max(8px, env(safe-area-inset-bottom)); }
      .dock-hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #top-controls, #dock, #intro-hint, .icon-pill, .dock-btn {
        transition: none;
      }
    }
  </style>
</head>
<body><a class="xmq-home" href="../" aria-label="返回作品首页"><span aria-hidden="true">‹</span> 作品</a>
  <canvas id="stage" role="img" aria-label="紫色夜空中的一把紫伞，星星从伞下落进水面。点击开合，左右滑动旋转，或者使用下方操作按钮。"></canvas>

  <!-- 顶部极简声音与纯净模式按钮 -->
  <div id="top-controls">
    <button id="btn-sound" class="icon-pill">🔊 声音</button>
    <button id="btn-bgm" class="icon-pill">钢琴夜曲：开</button>
    <button id="btn-zen" class="icon-pill" title="隐藏界面按钮，纯净欣赏">纯净</button>
  </div>

  <!-- 底部自由交互胶囊（开场动画结束后自动淡入） -->
  <div id="dock">
    <div class="dock-bar">
      <button id="dock-toggle" class="dock-btn primary">撑伞落星</button>
      <button id="dock-spin" class="dock-btn">转伞</button>
      <button id="dock-wish" class="dock-btn gold">许愿星</button>
      <button id="dock-replay" class="dock-btn">重播</button>
    </div>
    <div class="dock-hint">点击开合伞 · 左右滑动拨转 · 轻点水洼落许愿星</div>
  </div>

  <!-- 开场进度发丝线 -->
  <div id="intro-progress">
    <div id="intro-progress-fill"></div>
  </div>
  <div id="intro-hint" aria-hidden="true">轻触画面 · 即可互动</div>

  <script src="./violetAudio.js"></script>
  <script>
    const INTRO_DURATION = 13; // 开场动画时长（秒）

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    // A single audio implementation is kept in violetAudio.js.
    const audio = new VioletAudioEngine();

    /* =========================================================================
       2. 版画风「局部紫色流星雨」画布与交互主循环
       ========================================================================= */
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const topControls = document.getElementById('top-controls');
    const btnSound = document.getElementById('btn-sound');
    const btnBgm = document.getElementById('btn-bgm');
    const btnZen = document.getElementById('btn-zen');
    const dock = document.getElementById('dock');
    const dockToggle = document.getElementById('dock-toggle');
    const dockSpin = document.getElementById('dock-spin');
    const dockWish = document.getElementById('dock-wish');
    const dockReplay = document.getElementById('dock-replay');
    const introProgress = document.getElementById('intro-progress');
    const introProgressFill = document.getElementById('intro-progress-fill');

    const NUM_RIBS = 12;
    let W = window.innerWidth;
    let H = window.innerHeight;
    let dpr = 1;
    let time = 0;

    // 状态机：'idle' -> 'intro' -> 'interactive'
    let appState = 'idle';
    let introClock = 0;

    // 伞力学状态
    let targetOpen = 0;
    let prevTargetOpen = 0;
    let openVal = 0;
    let openVel = 0;
    let rot = 0.25;
    let omega = 0;
    let tiltExtra = 0;
    let ornamentSwing = 0;

    // 流星雨状态
    let rainActive = false;
    let starSpawnAcc = 0;
    const stars = [];
    const splashLines = [];
    const puddleRipples = [];
    const ambientDust = Array.from({ length: 22 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: 0.6 + Math.random() * 1.3,
      p: Math.random() * Math.PI * 2,
      vy: 0.004 + Math.random() * 0.008
    }));

    // 触控与鼠标交互状态
    let pDown = false, pMoved = false, startX = 0, startY = 0, lastX = 0;

    // 离屏生成深紫织物棉纸肌理（Risograph 版画海报质感）
    let paperTile = null;
    let backgroundLayer = null;
    function buildPaperTexture() {
      // Fine irregular grain instead of the former 2px crosshatch grid.
      const tc = document.createElement('canvas');
      const size = 240;
      tc.width = tc.height = size;
      const tctx = tc.getContext('2d');
      tctx.fillStyle = '#171124';
      tctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 1300; i++) {
        const light = Math.random() > 0.48;
        tctx.fillStyle = light
          ? `rgba(216, 198, 232, ${(Math.random() * 0.028).toFixed(3)})`
          : `rgba(8, 5, 15, ${(Math.random() * 0.055).toFixed(3)})`;
        tctx.fillRect(Math.random() * size, Math.random() * size, 1, 1);
      }
      paperTile = tc;
    }

    function buildBackgroundLayer() {
      const bg = document.createElement('canvas');
      bg.width = canvas.width;
      bg.height = canvas.height;
      const bctx = bg.getContext('2d');
      bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      bctx.fillStyle = bctx.createPattern(paperTile, 'repeat') || '#171124';
      bctx.fillRect(0, 0, W, H);

      // Broad diffuse illumination behind the canopy, cached on resize.
      const ambience = bctx.createRadialGradient(
        W * 0.50, H * 0.30, 0,
        W * 0.50, H * 0.37, Math.max(W, H) * 0.62
      );
      ambience.addColorStop(0, 'rgba(134, 105, 166, 0.115)');
      ambience.addColorStop(0.42, 'rgba(88, 67, 126, 0.045)');
      ambience.addColorStop(1, 'rgba(25, 17, 40, 0)');
      bctx.fillStyle = ambience;
      bctx.fillRect(0, 0, W, H);

      const vignette = bctx.createRadialGradient(
        W * .5, H * .43, Math.min(W, H) * .20,
        W * .5, H * .49, Math.max(W, H) * .80
      );
      vignette.addColorStop(0, 'rgba(37, 23, 53, 0)');
      vignette.addColorStop(1, 'rgba(5, 3, 10, 0.45)');
      bctx.fillStyle = vignette;
      bctx.fillRect(0, 0, W, H);
      backgroundLayer = bg;
    }

    function resize() {
      W = Math.max(1, Math.round(canvas.clientWidth || window.innerWidth));
      H = Math.max(1, Math.round(canvas.clientHeight || window.innerHeight));
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!paperTile) buildPaperTexture();
      buildBackgroundLayer();
    }

    function syncAudioUI() {
      btnSound.textContent = audio.enabled ? '🔊 声音' : '🔇 静音';
      btnSound.classList.toggle('muted', !audio.enabled);
      btnSound.setAttribute('aria-pressed', String(audio.enabled));
      btnBgm.textContent = audio.musicEnabled ? '钢琴夜曲：开' : '钢琴夜曲：关';
      btnBgm.classList.toggle('muted', !audio.musicEnabled);
      btnBgm.setAttribute('aria-pressed', String(audio.musicEnabled));
    }

    function setTargetOpen(val) {
      if (val > 0.5 && prevTargetOpen <= 0.5) audio.playOpen();
      else if (val <= 0.5 && prevTargetOpen > 0.5) audio.playClose();
      targetOpen = val;
      prevTargetOpen = val;
      dockToggle.textContent = targetOpen > 0.5 ? '合伞收池' : '撑伞落星';
    }

    function startIntro() {
      appState = 'intro';
      introClock = 0;
      targetOpen = 0;
      prevTargetOpen = 0;
      openVal = 0;
      openVel = 0;
      omega = 0.08;
      ornamentSwing = 0;
      starSpawnAcc = 0;
      rainActive = false;
      stars.length = 0;
      splashLines.length = 0;
      puddleRipples.length = 0;
      audio.resetPhrase();

      dock.classList.remove('visible');
      introProgress.classList.add('visible');
      introProgressFill.style.width = '0%';
      topControls.classList.add('visible');
      document.getElementById('intro-hint').classList.add('visible');
      dockToggle.textContent = '撑伞落星';
    }

    function enterInteractive() {
      appState = 'interactive';
      dock.classList.add('visible');
      introProgress.classList.remove('visible');
      document.getElementById('intro-hint').classList.remove('visible');
      dockToggle.textContent = targetOpen > 0.5 ? '合伞收池' : '撑伞落星';
    }

    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    let soundRequested = false;
    let soundBusy = false;
    let active = false;
    let frameRequest = 0;

    async function trySound() {
      if (!active || !soundRequested || audio.enabled || soundBusy) return;
      soundBusy = true;
      try {
        const enabled = await audio.enable();
        if (!enabled) soundRequested = false;
        if (!active || !soundRequested) audio.disable();
      } catch (_) {
        soundRequested = false;
        audio.disable();
      } finally {
        soundBusy = false;
        syncAudioUI();
      }
    }

    function showExperience() {
      if (active) return;
      active = true;
      startIntro();
      resize();
      if (motionPreference.matches) {
        setTargetOpen(1);
        openVal = 1;
        omega = 0;
        rainActive = false;
        enterInteractive();
      }
      last = performance.now();
      frameRequest = document.hidden ? 0 : requestAnimationFrame(loop);
      syncAudioUI();
    }

    function stopExperience() {
      if (!active) return;
      active = false;
      cancelAnimationFrame(frameRequest);
      frameRequest = 0;
      audio.disable();
      soundRequested = false;
      if (audio.ctx?.state === 'running') audio.ctx.suspend().catch(() => {});
      syncAudioUI();
    }

    document.addEventListener('visibilitychange', () => {
      if (!active) return;
      if (document.hidden) {
        cancelAnimationFrame(frameRequest);
        frameRequest = 0;
        if (audio.ctx?.state === 'running') audio.ctx.suspend().catch(() => {});
      } else {
        if (frameRequest) return;
        last = performance.now();
        frameRequest = requestAnimationFrame(loop);
        if (soundRequested && audio.enabled && audio.ctx?.state === 'suspended') {
          audio.ctx.resume().catch(() => {
            soundRequested = false;
            audio.disable();
            syncAudioUI();
          });
        }
      }
    });

    btnSound.addEventListener('click', () => {
      soundRequested = !soundRequested;
      if (soundRequested) trySound();
      else { audio.disable(); syncAudioUI(); }
    });

    btnBgm.addEventListener('click', () => {
      audio.musicEnabled = !audio.musicEnabled;
      syncAudioUI();
    });

    btnZen.addEventListener('click', () => {
      const zen = document.body.classList.toggle('zen-mode');
      btnZen.textContent = zen ? '显示按钮' : '纯净';
    });

    dockToggle.addEventListener('click', () => {
      if (appState !== 'interactive') enterInteractive();
      const next = targetOpen > 0.5 ? 0 : 1;
      setTargetOpen(next);
      rainActive = next > 0.5;
      if (next > 0.5) omega = 0.45;
    });

    dockSpin.addEventListener('click', () => {
      if (appState !== 'interactive') enterInteractive();
      if (targetOpen < 0.5) { setTargetOpen(1); rainActive = true; }
      omega = clamp(omega + 3.8, -7.8, 7.8);
    });

    dockWish.addEventListener('click', () => {
      if (appState !== 'interactive') enterInteractive();
      if (targetOpen < 0.5) { setTargetOpen(1); rainActive = true; }
      spawnWishStar();
    });

    dockReplay.addEventListener('click', () => {
      startIntro();
    });

    canvas.addEventListener('pointerdown', e => {
      if (appState === 'idle') return;
      pDown = true;
      pMoved = false;
      startX = lastX = e.clientX;
      startY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', e => {
      if (!pDown || appState === 'idle') return;
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > 7) {
        pMoved = true;
        if (appState === 'intro') enterInteractive();
        if (targetOpen < 0.5) { setTargetOpen(1); rainActive = true; }
        omega = clamp(dx * 0.22, -8.2, 8.2);
        rot += dx * 0.011;
      }
    });

    canvas.addEventListener('pointerup', e => {
      if (!pDown || appState === 'idle') return;
      pDown = false;
      if (!pMoved) {
        if (appState === 'intro') {
          enterInteractive();
          setTargetOpen(1);
          rainActive = true;
          return;
        }
        const P = getParams();
        if (openVal > 0.5 && Math.abs(e.clientY - P.puddleY) < Math.max(46, 36 * P.unit)) {
          spawnWishStar(e.clientX);
        } else {
          const next = targetOpen > 0.5 ? 0 : 1;
          setTargetOpen(next);
          rainActive = next > 0.5;
          if (next > 0.5) omega = 0.5;
        }
      }
    });

    canvas.addEventListener('pointercancel', () => { pDown = false; });

    function getParams() {
      // 同时适配手机竖屏海报比例与电脑宽屏电影比例
      const unit = Math.min(W / 270, H / 365);
      const cx = W * 0.5;
      const cy = H * (H < 500 ? 0.30 : 0.34);
      const puddleY = H * (H < 500 ? 0.69 : 0.785);
      const pitch = 0.22;
      const sway = openVal > 0.2 ? Math.sin(time * 1.05) * 0.085 * openVal : Math.sin(time * 0.8) * 0.018;
      const roll = sway + tiltExtra;
      return {
        unit, cx, cy, puddleY,
        cosP: Math.cos(pitch), sinP: Math.sin(pitch),
        cosR: Math.cos(roll), sinR: Math.sin(roll)
      };
    }

    function proj(lx, ly, lz, P) {
      const x0 = lx * P.unit, y0 = ly * P.unit, z0 = lz * P.unit;
      const y1 = y0 * P.cosP - z0 * P.sinP;
      const z1 = y0 * P.sinP + z0 * P.cosP;
      const x2 = x0 * P.cosR - y1 * P.sinR;
      const y2 = x0 * P.sinR + y1 * P.cosR;
      const cam = 720 * P.unit;
      const sc = cam / (cam - z1);
      return { x: P.cx + x2 * sc, y: P.cy - y2 * sc, z: z1 };
    }

    function getGeo(P) {
      const e = clamp(openVal, 0, 1);
      const easeR = Math.pow(e, 0.72);
      const apexY = 58;
      const R = lerp(6.5, 96, easeR);
      const D = lerp(104, 35, easeR);

      const ribs = [];
      for (let i = 0; i < NUM_RIBS; i++) {
        const th = rot + (Math.PI * 2 * i) / NUM_RIBS;
        const ct = Math.cos(th), st = Math.sin(th);
        const pts = [0, 0.38, 0.74, 1.0].map(t => {
          const r = R * Math.sin(t * Math.PI * 0.515);
          const y = apexY - D * Math.pow(t, 1.65);
          return proj(ct * r, y, st * r, P);
        });
        ribs.push({ pts, tip: pts[3] });
      }

      const ferrule = proj(0, apexY + 13, 0, P);
      const shaftEnd = proj(0, -70, 0, P);
      const hookPts = [];
      for (let k = 0; k <= 10; k++) {
        const a = (Math.PI * k) / 10;
        hookPts.push(proj(-9.8 + Math.cos(a) * 9.8, -70 - Math.sin(a) * 9.8, 0, P));
      }

      let minX = Infinity, maxX = -Infinity, avgRimY = 0;
      ribs.forEach(rb => {
        if (rb.tip.x < minX) minX = rb.tip.x;
        if (rb.tip.x > maxX) maxX = rb.tip.x;
        avgRimY += rb.tip.y;
      });
      return { ribs, ferrule, shaftEnd, hookPts, minX, maxX, avgRimY: avgRimY / NUM_RIBS };
    }

    function spawnStar(geo, P, isWish, forcedX) {
      const span = Math.max(24, (geo.maxX - geo.minX) * 0.86);
      const x = forcedX !== undefined
        ? clamp(forcedX, geo.minX + 10, geo.maxX - 10)
        : (P.cx + (Math.random() - 0.5) * span);

      const pal = [
        { fill: '#E7DFF4', tail: 'rgba(213, 200, 236, 0.38)' },
        { fill: '#BDAEDC', tail: 'rgba(176, 157, 211, 0.33)' },
        { fill: '#DDE1EF', tail: 'rgba(198, 204, 230, 0.36)' },
        { fill: '#D7BF9A', tail: 'rgba(207, 183, 146, 0.36)' }
      ];
      const col = isWish
        ? { fill: '#F2E1B9', tail: 'rgba(238, 212, 173, 0.76)' }
        : pal[Math.floor(Math.random() * pal.length)];
      const depthRoll = Math.random();
      const depth = isWish ? 1.12 : (depthRoll < 0.22 ? 0.65 : depthRoll < 0.88 ? 0.93 : 1.17);
      const alpha = isWish ? 1 : (depth < 0.8 ? 0.43 : depth > 1.1 ? 0.88 : 0.72);

      const puddleRx = lerp(9 * P.unit, Math.min(W * 0.40, 96 * P.unit), Math.pow(clamp(openVal, 0, 1), 0.78));
      const relX = clamp((x - P.cx) / Math.max(12, puddleRx), -0.88, 0.88);
      const maxOffY = Math.sqrt(Math.max(0.05, 1 - relX * relX)) * puddleRx * 0.165;

      stars.push({
        x,
        y: geo.avgRimY - 4 + (Math.random() - 0.5) * 14,
        vx: (omega * 7.2 + (Math.random() - 0.5) * 6) * P.unit * depth,
        vy: (isWish ? 115 : (60 + Math.random() * 62)) * P.unit * depth,
        size: (isWish ? 8.2 : (2.5 + Math.random() * 3.9)) * P.unit * depth,
        alpha,
        kind: isWish ? 8 : (Math.random() > 0.76 ? 4 : (Math.random() > 0.9 ? 8 : 0)),
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 1.6,
        color: col.fill,
        tailColor: col.tail,
        targetY: P.puddleY + (Math.random() - 0.45) * maxOffY * 1.45,
        isWish: !!isWish,
        tp: Math.random() * Math.PI * 2
      });
    }

    function spawnWishStar(xHint) {
      const P = getParams();
      spawnStar(getGeo(P), P, true, xHint);
      audio.playWishLaunch();
    }

    function spawnSplash(x, y, color, isWish, unit) {
      const count = isWish ? 13 : (4 + Math.floor(Math.random() * 4));
      for (let i = 0; i < count; i++) {
        const ang = -Math.PI * (0.12 + Math.random() * 0.76);
        const sp = (isWish ? 56 : 25) + Math.random() * (isWish ? 58 : 36);
        splashLines.push({
          x, y, px: x, py: y,
          vx: Math.cos(ang) * sp * unit,
          vy: Math.sin(ang) * sp * unit,
          life: 1,
          decay: isWish ? 1.4 : (2.0 + Math.random() * 0.9),
          color: Math.random() > 0.45 ? color : '#CDBCE0'
        });
      }
      puddleRipples.push({
        x, y,
        r: 2,
        maxR: (isWish ? 36 : 16 + Math.random() * 13) * unit,
        life: 1,
        color: isWish ? '#EBD6B4' : '#C5B4D8'
      });

      const pan = clamp(((x - W * 0.5) / (W * 0.45)), -0.8, 0.8);
      if (isWish) audio.playWishImpact(pan);
      else audio.playStarSplash(pan);
    }

    function drawStarShape(x, y, r, kind, rotation, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.fillStyle = color;
      if (kind === 0) {
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      } else if (kind === 4) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const rad = i % 2 === 0 ? r : r * 0.24;
          const a = (i * Math.PI) / 4;
          if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const rad = i % 2 === 0 ? (i % 4 === 0 ? r : r * 0.72) : r * 0.18;
          const a = (i * Math.PI) / 8;
          if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // Rather than switching colors at z=0, interpolate continuously as the
    // canopy rotates. The old front/back color jump caused the visible flash.
    function silkColor(dark, light, amount) {
      return `rgb(${Math.round(lerp(dark[0], light[0], amount))},
        ${Math.round(lerp(dark[1], light[1], amount))},
        ${Math.round(lerp(dark[2], light[2], amount))})`;
    }

    function drawPanel(r1, r2, depth, P) {
      const p1 = r1.pts, p2 = r2.pts;
      const rx = (p1[3].x + p2[3].x) * 0.5 + ((p1[0].x - (p1[3].x + p2[3].x) * 0.5) * 0.06 * openVal);
      const ry = (p1[3].y + p2[3].y) * 0.5 + ((p1[0].y - (p1[3].y + p2[3].y) * 0.5) * 0.06 * openVal);

      ctx.beginPath();
      ctx.moveTo(p1[0].x, p1[0].y);
      ctx.bezierCurveTo(p1[1].x, p1[1].y, p1[2].x, p1[2].y, p1[3].x, p1[3].y);
      ctx.quadraticCurveTo(rx, ry, p2[3].x, p2[3].y);
      ctx.bezierCurveTo(p2[2].x, p2[2].y, p2[1].x, p2[1].y, p2[0].x, p2[0].y);
      ctx.closePath();

      const frontness = clamp((depth / (96 * P.unit) + 1) * 0.5, 0, 1);
      const leftLight = clamp((P.cx - (p1[3].x + p2[3].x) * 0.5) / (180 * P.unit), -1, 1);
      const illumination = clamp(0.17 + frontness * 0.65 + leftLight * 0.075, 0.12, 0.91);
      const fabric = ctx.createLinearGradient(p1[0].x, p1[0].y, rx, ry);
      fabric.addColorStop(0, silkColor([98, 73, 144], [184, 154, 221], illumination));
      fabric.addColorStop(0.56, silkColor([75, 49, 122], [143, 101, 197], illumination));
      fabric.addColorStop(1, silkColor([53, 34, 101], [104, 64, 160], illumination));
      ctx.fillStyle = fabric;
      ctx.fill();

      // A satin seam, never a sharply glowing white line.
      ctx.strokeStyle = `rgba(217, 199, 237, ${(0.11 + frontness * 0.10).toFixed(3)})`;
      ctx.lineWidth = 0.65;
      ctx.stroke();
    }

    function updateIntro(dt) {
      introClock += dt;
      const dur = INTRO_DURATION;
      introProgressFill.style.width = `${clamp((introClock / dur) * 100, 0, 100)}%`;

      if (introClock < 1.1) {
        setTargetOpen(0);
        rainActive = false;
        omega += (0.05 - omega) * dt * 2;
      } else if (introClock < 2.8) {
        setTargetOpen(1);
        rainActive = introClock > 2.0;
        omega += (0.35 - omega) * dt * 2.5;
      } else if (introClock < 10.2) {
        setTargetOpen(1);
        rainActive = true;
        const spinWin = introClock > 5.2 && introClock < 8.6;
        const targetW = spinWin
          ? 0.4 + Math.sin(((introClock - 5.2) / 3.4) * Math.PI) * 2.7
          : 0.35;
        omega += (targetW - omega) * dt * 2.2;
      } else if (introClock < dur - 0.35) {
        // End with the purple umbrella open, not an empty scene.
        setTargetOpen(1);
        rainActive = true;
        omega += (0.18 - omega) * dt * 2.8;
      } else {
        setTargetOpen(1);
        rainActive = true;
        enterInteractive();
      }
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      time += dt;

      if (appState === 'intro') {
        updateIntro(dt);
      } else if (appState === 'interactive' && !pDown) {
        const idleSpin = motionPreference.matches ? 0 : (targetOpen > 0.5 ? 0.18 : 0);
        omega += (idleSpin - omega) * dt * 1.1;
      }

      // 弹簧阻尼开合伞
      openVel += ((targetOpen - openVal) * 14.0 - openVel * 5.6) * dt;
      openVal = clamp(openVal + openVel * dt, 0, 1.02);

      if (!pDown) rot += omega * dt;
      tiltExtra += (clamp(omega * 0.025, -0.12, 0.12) - tiltExtra) * dt * 3;
      ornamentSwing += (clamp(omega * 0.25, -1.2, 1.2) - ornamentSwing) * Math.min(1, dt * 2.3);

      // 驱动连续音频（钢琴夜曲、星雨底噪、转伞风铃）
      audio.updateContinuous({ dt, openVal, omega, rainActive });

      const P = getParams();
      const geo = getGeo(P);

      // 1. The paper and vignette are composited only on resize.
      ctx.drawImage(backgroundLayer, 0, 0, W, H);

      // 极淡的氛围微尘
      ambientDust.forEach(d => {
        if (!motionPreference.matches) d.y -= d.vy * dt;
        if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); }
        const tw = 0.25 + 0.75 * Math.sin(time * 1.4 + d.p);
        ctx.fillStyle = `rgba(190, 172, 215, ${0.09 * tw})`;
        ctx.beginPath();
        ctx.arc(d.x * W, d.y * H, d.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // 2. 与伞同步缩放的极简椭圆水洼
      const rx = lerp(9 * P.unit, Math.min(W * 0.40, 96 * P.unit), Math.pow(clamp(openVal, 0, 1), 0.78));
      const ry = rx * 0.165;
      ctx.save();
      const pg = ctx.createLinearGradient(P.cx - rx, P.puddleY, P.cx + rx, P.puddleY);
      pg.addColorStop(0, 'rgba(36, 28, 55, 0.98)');
      pg.addColorStop(0.5, 'rgba(92, 74, 133, 0.94)');
      pg.addColorStop(1, 'rgba(34, 28, 54, 0.98)');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.ellipse(P.cx, P.puddleY, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(194, 177, 215, 0.22)';
      ctx.lineWidth = 0.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(P.cx, P.puddleY, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();
      for (let i = puddleRipples.length - 1; i >= 0; i--) {
        const rp = puddleRipples[i];
        rp.r += dt * 28 * P.unit;
        rp.life = 1 - rp.r / rp.maxR;
        if (rp.life <= 0) { puddleRipples.splice(i, 1); continue; }
        ctx.strokeStyle = rp.color;
        ctx.globalAlpha = rp.life * 0.65;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.24, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      // 3. 立体折面版画紫伞 + 伞檐珍珠点链
      const panels = [];
      for (let i = 0; i < NUM_RIBS; i++) {
        const r1 = geo.ribs[i], r2 = geo.ribs[(i + 1) % NUM_RIBS];
        panels.push({ r1, r2, idx: i, zAvg: (r1.tip.z + r2.tip.z) * 0.5 });
      }
      panels.sort((a, b) => a.zAvg - b.zAvg);

      panels.filter(p => p.zAvg < 0).forEach(p => drawPanel(p.r1, p.r2, p.zAvg, P));

      ctx.save();
      ctx.strokeStyle = '#8367A7';
      ctx.lineWidth = 1.7 * P.unit;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(geo.ferrule.x, geo.ferrule.y);
      ctx.lineTo(geo.shaftEnd.x, geo.shaftEnd.y);
      ctx.stroke();

      ctx.strokeStyle = '#A38ABA';
      ctx.lineWidth = 2.2 * P.unit;
      ctx.beginPath();
      geo.hookPts.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
      ctx.stroke();
      ctx.restore();

      panels.filter(p => p.zAvg >= 0).forEach(p => drawPanel(p.r1, p.r2, p.zAvg, P));

      const beadA = clamp((openVal - 0.55) / 0.4, 0, 1);
      if (beadA > 0.02) {
        for (let i = 0; i < NUM_RIBS; i++) {
          const a = geo.ribs[i].tip, b = geo.ribs[(i + 1) % NUM_RIBS].tip;
          // Soft occlusion fade rather than an on/off visibility threshold.
          const depth = (a.z + b.z) * 0.5 / P.unit;
          const tVis = clamp((depth + 35) / 53, 0, 1);
          const visibility = tVis * tVis * (3 - 2 * tVis);
          if (visibility < 0.005) continue;
          ctx.save();
          ctx.globalAlpha = visibility;
          const sag = (7 + 2 * Math.sin(time * 2.2 + i)) * P.unit;
          for (let k = 1; k < 6; k++) {
            const t = k / 6;
            ctx.fillStyle = `rgba(219, 206, 237, ${beadA * 0.35})`;
            ctx.beginPath();
            const hang = Math.sin(t * Math.PI);
            ctx.arc(lerp(a.x, b.x, t) + ornamentSwing * 2.1 * P.unit * hang,
              lerp(a.y, b.y, t) + hang * sag, 0.67 * P.unit, 0, Math.PI * 2);
            ctx.fill();
          }
          if (i % 2 === 0) {
            const hy = a.y + (9 + Math.sin(time * 2.4 + i) * 2) * P.unit;
            const hx = a.x + ornamentSwing * (4 + 1.5 * Math.sin(time * 1.8 + i)) * P.unit;
            ctx.strokeStyle = `rgba(217, 204, 233, ${beadA * 0.24})`;
            ctx.lineWidth = 0.55;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(hx, hy);
            ctx.stroke();
            drawStarShape(hx, hy, 1.9 * P.unit, 4, 0, i % 4 === 0 ? '#D8C19D' : '#DED5EF');
          }
          ctx.restore();
        }
      }

      // 4. 伞下局部流星雨与手绘放射水花
      if (rainActive && openVal > 0.65) {
        starSpawnAcc += dt * (motionPreference.matches ? 2.6 : 6.1 + Math.abs(omega) * 1.6);
        while (starSpawnAcc >= 1) {
          starSpawnAcc -= 1;
          spawnStar(geo, P, false);
        }
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vx *= (1 - dt * 0.6);
        s.rot += s.vrot * dt;

        ctx.save();
        ctx.globalAlpha = s.alpha;
        const tx = s.x - s.vx * 0.14;
        const ty = s.y - (s.isWish ? 36 : 17) * P.unit;
        const tg = ctx.createLinearGradient(s.x, s.y, tx, ty);
        tg.addColorStop(0, s.tailColor);
        tg.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.strokeStyle = tg;
        ctx.lineWidth = s.isWish ? 1.45 : 0.9;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(tx, ty);
        ctx.stroke();

        if (s.isWish) {
          ctx.shadowBlur = 9 * P.unit;
          ctx.shadowColor = 'rgba(254, 240, 138, 0.35)';
        }
        drawStarShape(s.x, s.y, s.size * (0.85 + 0.18 * Math.sin(time * 6 + s.tp)), s.kind, s.rot, s.color);
        ctx.restore();
        if (s.y >= s.targetY) {
          spawnSplash(s.x, s.targetY, s.color, s.isWish, P.unit);
          stars.splice(i, 1);
        }
      }

      ctx.save();
      for (let i = splashLines.length - 1; i >= 0; i--) {
        const sp = splashLines[i];
        sp.px = sp.x; sp.py = sp.y;
        sp.x += sp.vx * dt; sp.y += sp.vy * dt;
        sp.vy += 125 * P.unit * dt;
        sp.life -= dt * sp.decay;
        if (sp.life <= 0) { splashLines.splice(i, 1); continue; }
        ctx.strokeStyle = sp.color;
        ctx.globalAlpha = sp.life * 0.84;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(sp.px, sp.py);
        ctx.lineTo(sp.x, sp.y);
        ctx.stroke();
      }
      ctx.restore();

      frameRequest = requestAnimationFrame(loop);
    }

    window.addEventListener('resize', resize);
    const embedded = new URLSearchParams(location.search).has('gallery') && window.parent !== window;
    if (embedded) {
      window.xmqRain = { start: showExperience, stop: stopExperience };
      document.querySelector('.xmq-home').addEventListener('click', event => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        window.parent.postMessage('xmq-rain-home', location.origin);
      });
    } else {
      showExperience();
    }
  </script>
</body>
</html>
