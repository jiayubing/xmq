<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1f8"><meta name="description" content="两件关于天气的小作品：雨伞与纸风车。"><title>一小段天气</title>
<style>
:root{--ink:#2b1a3f;--soft:#665571;--rule:#ddd1e5;--serif:"Noto Serif SC","Songti SC",STSong,SimSun,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(ellipse at 84% -40%,#dfc6ed,transparent 68%),#f6f1f8;font-family:system-ui,"Microsoft YaHei",sans-serif}.shell{width:min(100% - 80px,1080px);margin:auto}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--soft);font-size:10px;letter-spacing:.18em}header{padding:24px 0 16px;border-bottom:1px solid var(--rule)}.grid{margin-top:clamp(26px,5.5vw,65px)}#rain-room{position:fixed;inset:0;width:100%;height:100%;border:0;background:#160d2d}footer{padding:14px 0 24px;margin-top:32px;border-top:1px solid var(--rule)}.mark{display:flex;align-items:center;gap:9px}.mark svg{width:13px;color:#7d4f9c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(17px,3vw,30px)}.card{min-width:0;display:block;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:#fcf9fd;color:inherit;text-decoration:none;transition:transform .28s,box-shadow .28s}.card:focus-visible{outline:3px solid #8056a6;outline-offset:4px}.art{position:relative;overflow:hidden;isolation:isolate;aspect-ratio:1.67;background:#2a1646}.art>svg,.field{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s}.field{object-position:50% 60%}.wheel,.stem{position:absolute;left:53%;top:46%}.wheel{width:36%;transform:translate(-50%,-50%);clip-path:polygon(54% 1%,49% 24%,48% 29%,62% 26%,70% 25%,77% 29%,96% 49%,71% 48%,71% 59%,73% 70%,67% 80%,47% 97%,50% 70%,42% 72%,27% 74%,17% 68%,4% 52%,27% 53%,25% 43%,23% 30%,26% 25%)}.stem{width:1.1%;height:58%;background:#a97b5b;border-radius:10px;transform-origin:top;transform:rotate(-10deg)}
.label{position:absolute;top:12px;left:12px;border:1px solid #fff7;border-radius:99px;padding:5px 8px;color:white;background:#261739a0;letter-spacing:.12em;font-size:10px}.info{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;padding:17px clamp(15px,3vw,25px) 19px}.info h2{font:600 clamp(22px,3.5vw,32px)/1.25 var(--serif);margin:0}.info p{grid-column:1;margin:0;color:var(--soft);font-size:13px;line-height:1.6}.arrow{grid-column:2;grid-row:1/3;display:grid;place-items:center;border:1px solid var(--rule);border-radius:50%;width:36px;height:36px;color:#68408f;transition:color .28s,background .28s}.card:focus-visible .arrow{color:white;background:#68408f}
@media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 14px 32px #46245f20}.card:hover .art>svg,.card:hover .field{transform:scale(1.035)}.card:hover .arrow{color:white;background:#68408f}}
@media(max-width:640px){.shell{width:calc(100% - 36px)}header{padding-top:17px}.grid{margin-top:24px}.grid{grid-template-columns:1fr}footer{margin-top:23px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell">
<header><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c1 8 4 11 12 12-8 1-11 4-12 12-1-8-4-11-12-12 8-1 11-4 12-12Z"/></svg>XINGMENGQI</span><span>MOTION STUDIES / VOL. 01</span></header>
<main><div class="grid">
<a class="card" href="./umbrella/" data-rain><div class="art" aria-hidden="true">
<svg viewBox="0 0 560 330" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>
<linearGradient id="sky" x2="0%" y2="100%"><stop stop-color="#160e2a"/><stop offset="1" stop-color="#48305d"/></linearGradient><radialGradient id="glow"><stop stop-color="#bb83d9" stop-opacity=".62"/><stop offset="1" stop-color="#a86ccd" stop-opacity="0"/></radialGradient>
<linearGradient id="silk" x2="90%" y2="100%"><stop stop-color="#edcff4"/><stop offset=".48" stop-color="#aa78c0"/><stop offset="1" stop-color="#543177"/></linearGradient><linearGradient id="meteor" x2="100%" y2="0%"><stop stop-color="#efd4ff" stop-opacity=".78"/><stop offset="1" stop-color="#efd4ff" stop-opacity="0"/></linearGradient></defs>
<path fill="url(#sky)" d="M0 0h560v330H0z"/><ellipse fill="url(#glow)" cx="294" cy="151" rx="216" ry="130"/>
<path fill="#261933" opacity=".8" d="M0 268Q107 244 206 270T418 274T560 254V330H0Z"/>
<g fill="none" stroke="#c9a0e8" opacity=".38"><ellipse cx="292" cy="283" rx="84" ry="11"/><ellipse cx="292" cy="285" rx="122" ry="20"/><path d="M93 295q22-6 47-1m278 5q31-6 50-1"/></g>
<g stroke="url(#meteor)" stroke-linecap="round" stroke-width="1.5"><path d="m101 109 46-62m8 43 29-39m53 44 24-32m115 36 47-63m13 82 41-54m-22 116 30-40m-414 77 32-46m366 66 27-35m-384 28 24-34"/></g>
<path d="M285 103v137c0 21-25 23-26 4" fill="none" stroke="#ddbee9" stroke-width="3.6" stroke-linecap="round"/>
<path d="M159 176c25-42 70-68 126-70 57 1 101 27 126 70-22-12-43-11-63 2-24-13-44-13-63 0-20-13-42-13-63 0-21-13-41-14-63-2Z" fill="url(#silk)" stroke="#ebd0f3" stroke-width="1.3"/>
<path d="M222 178c14-37 37-61 63-72m0 72c8-29 9-51 0-72m63 72c-13-35-37-61-63-72" fill="none" stroke="#f4dafa" stroke-opacity=".66"/>
<g fill="#efd7fa"><circle cx="69" cy="66" r="1.1"/><circle cx="511" cy="90" r="1.2"/><circle cx="280" cy="42" r="1.2"/><circle cx="198" cy="40" r="1.1"/><circle cx="230" cy="202" r="1.7"/><circle cx="251" cy="226" r="1.2"/><circle cx="320" cy="222" r="1.6"/><circle cx="336" cy="249" r="1.3"/><circle cx="310" cy="271" r="1.7"/><path d="m375 211 2 7 7 2-7 2-2 7-2-7-7-2 7-2zm-198-90 1.5 5 5 1.5-5 1.5-1.5 5-1.5-5-5-1.5 5-1.5z"/></g></svg>
<span class="label">01 / 夜雨</span></div><div class="info"><h2>雨伞</h2><p>撑开一把紫伞，让流星落进水里</p><span class="arrow" aria-hidden="true">↗</span></div></a>
<a class="card" href="./pinwheel/"><div class="art" aria-hidden="true"><img class="field" src="./assets/meadow.webp" width="560" height="330" alt=""><span class="stem"></span><img class="wheel" src="./assets/pinwheel.webp" alt=""><span class="label">02 / 微风</span></div><div class="info"><h2>纸风车</h2><p>看彩纸飞过草地，从白天吹到日落</p><span class="arrow" aria-hidden="true">↗</span></div></a>
</div></main><footer><span>一个小小的动画展厅</span><span>01 — 02</span></footer></div><iframe id="rain-room" src="./umbrella/?gallery=clean" allow="autoplay" title="雨伞动画" hidden></iframe>
<script>
const frame = document.querySelector('#rain-room');
const gallery = document.querySelector('.shell');
const umbrellaLink = document.querySelector('[data-rain]');
const homeTitle = document.title;
const homeURL = location.href;
const rainURL = umbrellaLink.href;
let opened = false;
function showGallery() {
  if (!opened) return;
  frame.contentWindow.xmqRain.stop();
  frame.hidden = true;
  gallery.hidden = false;
  document.title = homeTitle;
  opened = false;
  umbrellaLink.focus({preventScroll:true});
}
function showRain() {
  const rain = frame.contentWindow.xmqRain;
  if (!rain || opened) return false;
  frame.hidden = false;
  gallery.hidden = true;
  opened = true;
  document.title = frame.contentDocument.title;
  rain.start();
  frame.contentWindow.focus();
  return true;
}
umbrellaLink.addEventListener('click', event => {
  if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  if (!showRain()) return;
  event.preventDefault();
  history.pushState({ xmqRain:true }, '', rainURL);
});
window.addEventListener('popstate', event => {
  if (event.state?.xmqRain) {
    if (!showRain()) location.replace(rainURL);
  } else showGallery();
});
window.addEventListener('message', event => {
  if (!opened || event.origin !== location.origin || event.source !== frame.contentWindow || event.data !== 'xmq-rain-home') return;
  if (history.state?.xmqRain) history.back();
  else location.replace(homeURL);
});
</script></body></html>
