<!doctype html><html lang="zh-CN"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dcebf2"><meta name="description" content="一只纸风车，一阵彩色的风。从白昼到日落，慢慢把时间交给风。"><title>纸风车</title><link rel="stylesheet" href="pinwheel.css?v=13"><style>.xmq-home{position:fixed;z-index:40;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border:1px solid #e9dcfa66;border-radius:999px;background:#231537bc;color:#f8efff;font:12px/1 system-ui,sans-serif;text-decoration:none;gap:5px}.xmq-home:hover{background:#231537}.xmq-home:focus-visible{outline:2px solid #f8efff;outline-offset:2px}body.zen-mode .xmq-home{display:none}</style></head><body><a class="xmq-home" href="../" aria-label="返回作品首页"><span aria-hidden="true">‹</span> 作品</a>
