<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9edee">
  <title>小雪 · 虹藏</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script defer src="art/layers.js"></script>
  <script defer src="sound.js"></script>
  <script defer src="weather.js"></script>
  <script defer src="painting.js"></script>
  <script defer src="scene.js"></script>
</head>
<body>
  <main id="scene" class="scene" data-mode="loading">
    <canvas id="painting" aria-hidden="true"></canvas>
    <div id="lake" class="lake" role="region" tabindex="-1" aria-label="雪湖" aria-describedby="lake-help" aria-hidden="true"></div>

    <nav class="controls" aria-label="场景控制">
      <button id="replay" type="button">重看</button>
      <button id="sound" type="button" aria-pressed="true">声音</button>
    </nav>
    <button id="skip" class="skip" type="button" hidden>跳过</button>

    <div id="chapters" class="chapters">
      <p class="caption" aria-hidden="true"><small>初候 ·</small> 虹藏不见</p>
      <p class="caption" aria-hidden="true"><small>二候 ·</small> 天气上升 地气下降</p>
      <p class="caption" aria-hidden="true"><small>三候 ·</small> 闭塞而成冬</p>
    </div>

    <section id="colophon" class="colophon" aria-label="小雪落款" aria-hidden="true">
      <h1 id="title" class="column title" aria-label="小雪">小雪</h1>
      <p id="date" class="column solar-date" aria-label="十一月二十二日 · 太阳黄经二百四十度">十一月二十二日 · 太阳黄经二百四十度</p>
      <p id="verse" class="column verse" aria-label="七色入雪">七色入雪</p>
      <div class="column closing">
        <p id="ending" aria-label="待春而见">待春而见</p>
        <img id="seal" class="seal" src="art/seal.webp" alt="藏虹" width="41" height="41">
      </div>
    </section>

    <p id="legend" class="legend" aria-hidden="true">
      初候 虹藏不见 · 二候 天气上升 地气下降<span class="legend-break" aria-hidden="true"> · </span><span class="legend-last">三候 闭塞而成冬</span>
    </p>
    <p id="hint" class="hint" aria-hidden="true">暖光之下 雪里有虹</p>
    <ul id="tray" class="tray" aria-label="七色托盘" aria-hidden="true"></ul>

    <p id="lake-help" class="offscreen">用鼠标或手指移动暖光，点亮雪花后轻触收色。也可以用方向键移动暖光，按回车收色或敲冰。</p>
    <p id="announcement" class="offscreen" role="status" aria-live="polite"></p>
    <p id="load-error" class="load-error" hidden>画卷暂未展开，请刷新重试。</p>
    <noscript><p class="load-error">请开启 JavaScript，展开小雪画卷。</p></noscript>
  </main>
</body>
</html>
